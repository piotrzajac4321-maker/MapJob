        { name: 'Pruszków - co się dzieje', attempts: 12, posted: 10, pct: 83 },
      ];

      // ============== ROUTER ==============
      const view = document.getElementById('view');
      function route() {
        const hash = (location.hash || '#dashboard').slice(1);
        document.querySelectorAll('[data-route]').forEach((el) => {
          el.classList.toggle('active', el.dataset.route === hash);
        });
        const tmpl = document.getElementById(`tmpl-${hash}`);
        if (!tmpl) { view.innerHTML = '<p class="text-muted">Brak widoku.</p>'; return; }
        view.innerHTML = '';
        view.appendChild(tmpl.content.cloneNode(true));
        if (renderers[hash]) renderers[hash]();
      }

      // ============== RENDERERS ==============
      const renderers = {};

      function statusBadge(status) {
        const map = {
          ready: ['bg-green/20', 'text-green', 'gotowy'],
          draft: ['bg-yellow/20', 'text-yellow', 'szkic'],
          archived: ['bg-muted/20', 'text-muted', 'archiwum'],
          running: ['bg-green/20', 'text-green', 'w toku'],
          scheduled: ['bg-accent/20', 'text-accent', 'zaplanowana'],
          paused: ['bg-yellow/20', 'text-yellow', 'pauza'],
          done: ['bg-muted/20', 'text-muted', 'zakończona'],
          posted: ['bg-green/20', 'text-green', 'opublikowany'],
          skipped: ['bg-yellow/20', 'text-yellow', 'pominięty'],
        };
        const [bg, fg, label] = map[status] || ['bg-muted/20', 'text-muted', status];
        return `<span class="badge ${bg} ${fg}">${label}</span>`;
      }

      function humanBadge(score) {
        const color = score >= 75 ? 'text-green' : score >= 60 ? 'text-yellow' : 'text-red';
        return `<span class="${color} font-semibold">${score}/100</span>`;
      }

      renderers.dashboard = () => {
        const cbody = document.getElementById('dashboard-campaigns');
        cbody.innerHTML = CAMPAIGNS.filter(c => c.status === 'running' || c.status === 'scheduled')
          .map(c => `
            <tr class="border-b border-border last:border-0 hover:bg-cardHover">
              <td class="px-4 py-3">${c.name}</td>
              <td class="px-4 py-3">${statusBadge(c.status)}</td>
              <td class="px-4 py-3 text-right">${c.posted}</td>
              <td class="px-4 py-3 text-right">${c.pending}</td>
              <td class="px-4 py-3 text-right text-yellow">${c.skipped}</td>
              <td class="px-4 py-3 text-right font-semibold">${c.pct}%</td>
            </tr>
          `).join('');

        document.getElementById('recent-publications').innerHTML = RECENT.map(r => `
          <div class="flex items-center justify-between border-b border-border pb-2 last:border-0">
            <div>
              <div class="text-white">${r.group}</div>
              <div class="text-xs text-muted">${r.when}${r.reason ? ' · ' + r.reason : ''}</div>
            </div>
            ${statusBadge(r.status)}
          </div>
        `).join('');
      };

      renderers.posts = () => {
        document.getElementById('posts-list').innerHTML = POSTS.map(p => `
          <tr class="border-b border-border last:border-0 hover:bg-cardHover">
            <td class="px-4 py-3">${p.title}</td>
            <td class="px-4 py-3 text-muted">${p.type}</td>
            <td class="px-4 py-3 mono text-xs">${p.framework}</td>
            <td class="px-4 py-3">${statusBadge(p.status)}</td>
            <td class="px-4 py-3 text-right">${humanBadge(p.human)}</td>
            <td class="px-4 py-3 text-right text-muted text-xs">${p.created}</td>
          </tr>
        `).join('');
      };

      renderers.groups = () => {
        document.getElementById('groups-list').innerHTML = GROUPS.map(g => `
          <tr class="border-b border-border last:border-0 hover:bg-cardHover">
            <td class="px-4 py-3">${g.name}</td>
            <td class="px-4 py-3 text-right">${g.members.toLocaleString('pl-PL')}</td>
            <td class="px-4 py-3 text-muted text-xs">${g.privacy}</td>
            <td class="px-4 py-3">${g.tags.map(t => `<span class="badge bg-cardHover text-muted mr-1">${t}</span>`).join('')}</td>
            <td class="px-4 py-3 text-right text-muted">${g.cooldown} min</td>
            <td class="px-4 py-3 text-right text-muted text-xs">${g.lastPost}</td>
          </tr>
        `).join('');
      };

      renderers.campaigns = () => {
        document.getElementById('campaigns-list').innerHTML = CAMPAIGNS.map(c => `
          <tr class="border-b border-border last:border-0 hover:bg-cardHover">
            <td class="px-4 py-3">${c.name}</td>
            <td class="px-4 py-3 text-muted text-xs">${c.post}</td>
            <td class="px-4 py-3">${statusBadge(c.status)}</td>
            <td class="px-4 py-3 text-right">${c.posted} / ${c.total}</td>
            <td class="px-4 py-3 text-right text-yellow">${c.skipped}</td>
            <td class="px-4 py-3 text-right font-semibold">${c.pct}%</td>
            <td class="px-4 py-3 text-right">
              ${c.status === 'running' ? '<button class="text-xs text-muted hover:text-white">Pauza</button>' :
                c.status === 'paused' ? '<button class="text-xs text-accent">Wznów</button>' :
                c.status === 'draft' || c.status === 'scheduled' ? '<button class="text-xs text-accent">Start</button>' :
                '<span class="text-xs text-muted">—</span>'}
            </td>
          </tr>
        `).join('');
      };

      renderers.analytics = () => {
        // Per-day bar chart
        const days = [12, 18, 24, 31, 22, 8, 14, 28, 35, 41, 38, 52, 47, 73];
        const max = Math.max(...days);
        document.getElementById('chart-perday').innerHTML = days.map(v => `
          <div class="flex-1 flex flex-col items-center justify-end gap-1 group cursor-pointer">
            <div class="text-[10px] text-muted opacity-0 group-hover:opacity-100">${v}</div>
            <div class="w-full bg-accent rounded-t" style="height: ${(v/max)*100}%; min-height: 4px;"></div>
          </div>
        `).join('');
        document.getElementById('chart-perday-labels').innerHTML = ['Pn','Wt','Śr','Cz','Pt','So','Nd','Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d => `<span class="flex-1 text-center">${d}</span>`).join('');

        // Hours
        const hours = [0,0,0,0,1,2,4,8,14,22,28,31,29,26,24,28,32,38,34,22,12,6,2,1];
        const hMax = Math.max(...hours);
        document.getElementById('chart-hours').innerHTML = hours.map(v => `
          <div class="flex-1 bg-accent rounded-t" style="height: ${(v/hMax)*100}%; min-height: 2px;" title="${v} postów"></div>
        `).join('');

        document.getElementById('top-groups').innerHTML = TOP_GROUPS.map(g => `
          <div class="flex items-center justify-between border-b border-border pb-2 last:border-0">
            <div class="flex-1 truncate pr-3">${g.name}</div>
            <div class="text-muted text-xs mr-3">${g.posted}/${g.attempts}</div>
            <div class="font-semibold ${g.pct >= 90 ? 'text-green' : g.pct >= 70 ? 'text-yellow' : 'text-red'}">${g.pct}%</div>
          </div>
        `).join('');

        document.getElementById('top-errors').innerHTML = ERRORS.map(e => `
          <div class="flex items-center justify-between border-b border-border pb-2 last:border-0">
            <code class="text-xs">${e.code}</code>
            <span class="text-muted">${e.count}×</span>
          </div>
        `).join('');
      };

      // ============== AI GENERATOR (mock) ==============
      function mockGenerate() {
        const type = document.getElementById('ai-type').value;
        const framework = document.getElementById('ai-framework').value;
        const audience = document.getElementById('ai-audience').value || '[audience nieuzupełnione]';
        const brand = document.getElementById('ai-brand-name').value || 'Twoja firma';
        const offer = document.getElementById('ai-offer').value || 'oferty';
        const region = document.getElementById('ai-region').value || 'okolicy';
        const budget = document.getElementById('ai-budget').value || '';
        const cta = document.getElementById('ai-cta').value || 'Pisz w wiadomości, oddzwaniam dziś';
        const contact = document.getElementById('ai-contact').value || '';

        const offerShort = offer.split('.')[0].slice(0, 120);

        const variants = type === 'job' ? [
          // PAS
          `Szukam u nas w ${region} osoby do roboty.\n\n${offerShort}.${budget ? ' Stawka ' + budget + '.' : ''} Dwie zmiany, hala B na Powstańców 12. Mam też premię 500/m za wieczorówki.\n\nLudzie odpadają zwykle na "a gdzie to dokładnie" - więc piszę od razu: 5 min od przystanku autobusu 197.\n\n${cta}.${contact ? ' ' + contact : ''}`,
          // AIDA
          `Hej grupa ${region}! 👋\n\n${offerShort}.\n\nU nas konkretnie: ${budget || 'stawka uczciwa'}, decyzja w 24h od rozmowy, hala 5 min od przystanku. Bez ściemy o "konkurencyjnym wynagrodzeniu".\n\nKto się odzywa dziś, dzwonimy jeszcze przed weekendem. ${cta}.`,
          // BAB
          `Trzy lata temu Marek dojeżdżał 1h 20 min do roboty. Teraz robi u nas w ${region}, 12 min od domu.\n\n${offerShort}.${budget ? ' ' + budget + ' netto + premia.' : ''}\n\nNie obiecuję "pracy marzeń". Obiecuję konkret: 5 min od autobusu, ekipa 8 osób, brygadzista co tłumaczy raz a porządnie.\n\n${cta}.`,
        ] : [
          // SALES PAS
          `Klima w samochodzie dmucha ciepłe powietrze a lipiec już za rogiem? Tyle.\n\n${offerShort}.${budget ? ' ' + budget + ', wszystko w cenie.' : ''} Montujemy u Ciebie pod blokiem, w 4h, gwarancja 5 lat. Zostały 4 terminy w lipcu - serwisy w mieście są już zarobione.\n\n${cta}.${contact ? ' ' + contact : ''}`,
          // SALES AIDA
          `27 stopni w aucie o 8 rano i dopiero rośnie. ☀️\n\n${offerShort}. ${budget || 'Cena uczciwa'}, robota w 4h, 5 lat gwarancji. Jeździsz do roboty z dzieckiem - ważne.\n\n${cta}.`,
          // SALES BAB
          `Stara klima: 30 minut w korku w aucie z dzieckiem to tortura. Nowa: chłodno w 90 sekund.\n\n${offerShort}.\n\nMontaż 4h u Ciebie, gwarancja 5 lat. ${budget ? budget + ', bez dopłat.' : ''} ${cta}.`,
        ];

        const human = [87, 82, 91];
        const warnings = [['em_dash: zamieniono 2× —'], [], ['too_uniform_sentences: σ=2.1 (warn)']];

        const resultEl = document.getElementById('ai-result');
        const placeholderEl = document.getElementById('ai-result-placeholder');
        const meta = document.getElementById('ai-result-meta');

        placeholderEl.classList.add('hidden');
        resultEl.classList.remove('hidden');
        meta.innerHTML = `<span class="text-green">●</span> 4.2s · Tokens: 1240+680 · Koszt: $0.0084 · 1× regenerate`;

        resultEl.innerHTML = `
          <div class="flex gap-2">
            ${variants.map((_, i) => `
              <button data-var="${i}" class="variant-tab flex-1 px-3 py-2 rounded-md text-sm border ${i===0 ? 'bg-accent border-accent text-white' : 'bg-card border-border'}">
                Wariant ${i+1}<br><span class="text-xs opacity-75">human ${human[i]}/100</span>
              </button>
            `).join('')}
          </div>
          <div id="variant-content"></div>
        `;

        function showVariant(i) {
          const text = variants[i];
          const score = human[i];
          const warn = warnings[i];

          // Compute live checks (z anti-AI filter logiki)
          const hasNumber = /\d/.test(text);
          const hasProper = /(?<=[^.!?]\s)[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+/.test(text);
          const hasEmDash = /—/.test(text);
          const sentences = text.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
          const hasShort = sentences.some(s => s.split(/\s+/).length <= 5);
          const hasColloquial = /\b(daj znać|odzywaj|pisz|dm|tagnij|u nas|tu w|po sąsiedzku|domknąć|rekru|cv-k|lead|krótko mówiąc)\b/i.test(text);
          const tooLong = text.length > 900;

          const checks = [
            { label: 'Konkretna liczba/kwota', ok: hasNumber },
            { label: 'Nazwa własna (dzielnica/firma)', ok: hasProper },
            { label: 'Brak em-dashy (—)', ok: !hasEmDash },
            { label: 'Krótkie zdanie (≤5 słów)', ok: hasShort },
            { label: 'Branżowy żargon / kolokwializm', ok: hasColloquial },
            { label: `Długość ${text.length} < 900`, ok: !tooLong },
          ];

          document.getElementById('variant-content').innerHTML = `
            <div class="bg-card border border-border rounded-lg p-4 mb-3">
              <div class="flex items-center justify-between mb-3">
                <div class="${score>=75?'text-green':score>=60?'text-yellow':'text-red'} font-semibold">
                  Human score: ${score}/100 ${score>=75?'✓ brzmi jak człowiek':score>=60?'⚠ sprawdź checklist':'✗ pachnie AI'}
                </div>
                ${warn.length ? '<span class="badge bg-yellow/20 text-yellow">'+warn.length+' warn</span>' : '<span class="badge bg-green/20 text-green">clean</span>'}
              </div>
              <pre class="whitespace-pre-wrap mono text-sm bg-bg p-3 rounded border border-border">${text.replace(/</g,'&lt;')}</pre>
            </div>

            <div class="bg-card border border-border rounded-lg p-4">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold text-sm">Humanize checklist</h3>
                <span class="text-xs text-muted">${checks.filter(c=>c.ok).length}/${checks.length}</span>
              </div>
              <ul class="space-y-1.5 text-sm">
                ${checks.map(c => `
                  <li class="flex gap-2">
                    <span class="${c.ok?'checkmark':'crossmark'}">${c.ok?'✓':'○'}</span>
                    <span class="${c.ok?'':'text-muted'}">${c.label}</span>
                  </li>
                `).join('')}
              </ul>
            </div>

            ${warn.length ? `
              <div class="bg-yellow/10 border border-yellow/30 text-yellow/90 rounded-md p-3 text-sm mt-3">
                <strong>Anti-AI filter:</strong> ${warn.join(', ')}
              </div>
            ` : ''}

            <div class="flex gap-2 mt-3">
              <button class="flex-1 bg-accent hover:bg-accentHover px-4 py-2 rounded-md text-sm font-medium">Zapisz w bibliotece</button>
              <button class="border border-border px-4 py-2 rounded-md text-sm hover:bg-cardHover">Regeneruj</button>
            </div>
          `;
        }

        showVariant(0);
        resultEl.querySelectorAll('.variant-tab').forEach(btn => {
          btn.addEventListener('click', (e) => {
            resultEl.querySelectorAll('.variant-tab').forEach(b => b.className = 'variant-tab flex-1 px-3 py-2 rounded-md text-sm border bg-card border-border');
            e.currentTarget.className = 'variant-tab flex-1 px-3 py-2 rounded-md text-sm border bg-accent border-accent text-white';
            showVariant(Number(e.currentTarget.dataset.var));
          });
        });
      }

      renderers.ai = () => {
        // Wstępne dane przykładowe
        document.getElementById('ai-audience').value = 'mężczyźni 25-50, spawacze, mieszkańcy Pruszkowa i Warszawy zachodniej';
        document.getElementById('ai-brand-name').value = 'Stalmet Pruszków';
        document.getElementById('ai-brand-oneliner').value = 'Zakład spawalniczy z 14-osobową ekipą, hala na Powstańców 12';
        document.getElementById('ai-brand-usp').value = 'Dwie zmiany, bez weekendów\nStawka 7 200+ premia\nBrygadzista co tłumaczy raz';
        document.getElementById('ai-offer').value = 'szukamy spawacza MIG/MAG, hala Bemowo Powstańców 12, dwie zmiany, stawka od 7 200 netto, premia 500/m za wieczorówki, dojazd autobusem 197';
        document.getElementById('ai-region').value = 'Warszawa Bemowo / Pruszków';
        document.getElementById('ai-budget').value = '7 200 PLN netto + premia';
        document.getElementById('ai-contact').value = 'tel. 555-123-456';
        document.getElementById('ai-cta').value = 'Zostaw numer w komentarzu, oddzwaniam jeszcze dziś';

        document.getElementById('ai-generate-btn').addEventListener('click', () => {
          const btn = document.getElementById('ai-generate-btn');
          btn.disabled = true;
          btn.textContent = '⏳ Claude generuje... (Sonnet 4.6)';
          setTimeout(() => {
            mockGenerate();
            btn.disabled = false;
            btn.innerHTML = '⚡ Wygeneruj kolejne 3 warianty';
          }, 1800);
        });
      };

      window.addEventListener('hashchange', route);
      route();
    </script>
  </body>
</html>
