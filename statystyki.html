<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<meta name="robots" content="noindex,nofollow">
<title>Statystyki — MapJob</title>
<style>
:root{--bg:#080D18;--surf:#131C2D;--surf2:#1A2438;--border:rgba(255,255,255,.10);--text:#F0F4FF;--text2:#94A3B8;--text3:#5A6678;--blue:#60A5FA;--purple:#A78BFA;--green:#22C55E;--gold:#F59E0B;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px;max-width:680px;margin:0 auto;min-height:100dvh}
h1{font-size:18px;font-weight:900;margin-bottom:2px}
.sub{font-size:11px;color:var(--text3);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10px;color:var(--text3);font-weight:700}
.kpi .v{font-size:24px;font-weight:900;margin-top:3px}
.sec{margin-bottom:16px}
.sec-h{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-h .cnt{font-size:11px;color:var(--text3);font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.row .rk{font-size:12px;font-weight:800;color:var(--text3);min-width:24px;text-align:right}
.row .mid{flex:1;min-width:0}
.row .t{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:11px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:900;padding:4px 9px;border-radius:8px;flex-shrink:0;background:var(--surf);border:1px solid var(--border);color:var(--text3)}
.chip.b{color:var(--blue)}.chip.u{color:var(--purple)}
.more{width:100%;padding:10px;margin-top:2px;border-radius:10px;background:var(--surf);border:1px solid var(--border);color:var(--text2);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.btn{padding:10px 14px;border-radius:10px;background:var(--surf);border:1px solid var(--border);color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.btnp{background:linear-gradient(135deg,#2563EB,#1D6FF2);border:none;color:#fff}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.fi{width:100%;padding:11px 12px;border-radius:10px;background:var(--surf2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:14px;margin-bottom:8px}
.muted{color:var(--text3);font-size:12px;line-height:1.6}
.center{text-align:center;padding:40px 16px}
.empty{text-align:center;padding:18px;color:var(--text3);font-size:13px}
.loader{text-align:center;padding:18px;color:var(--text3);font-size:13px}
.err{color:#F87171;font-size:12px;margin-top:6px;min-height:16px}
</style>
</head>
<body>
<div id="app"><div class="loader">Ładowanie…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL='https://ahgzjneegvptudphibdm.supabase.co';
var SB_KEY='sb_publishable__B7I_Ji4umLpI3mzW3CM6A_1YAxYmhb';
var sb;
var TOP=10;
var state={pins:[],tenders:[],jobs:[]};
var expanded={pins:false,tenders:false,jobs:false};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}

window.addEventListener('load', async function(){
  if(typeof supabase==='undefined'){ document.getElementById('app').innerHTML='<div class="center muted">Brak połączenia (nie załadowano biblioteki). Sprawdź internet i odśwież.</div>'; return; }
  sb = supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, detectSessionInUrl:false}});
  route();
});

async function route(){
  var app=$('app'); app.innerHTML='<div class="loader">Sprawdzam dostęp…</div>';
  var s=null; try{ var g=await sb.auth.getSession(); s=g&&g.data&&g.data.session; }catch(e){}
  if(!s){ showLogin('Zaloguj się jako administrator.'); return; }
  var r; try{ r=await sb.rpc('admin_get_view_kpis'); }catch(e){ r={error:{message:String(e)}}; }
  if(r.error){
    if(/forbidden/i.test(r.error.message)){ showDenied(); }
    else { showLogin('Sesja wygasła — zaloguj się ponownie.'); }
    return;
  }
  renderDashboard(r.data);
}

function showLogin(msg){
  $('app').innerHTML =
    '<div class="center"><h1>📊 Statystyki MapJob</h1><div class="sub">Panel tylko dla administratora</div></div>'
    + '<div style="max-width:340px;margin:0 auto">'
    + '<div class="muted" style="margin-bottom:12px;text-align:center">'+esc(msg)+'</div>'
    + '<input class="fi" id="li-email" type="email" placeholder="E-mail admina" autocomplete="email">'
    + '<input class="fi" id="li-pass" type="password" placeholder="Hasło" autocomplete="current-password">'
    + '<button class="btn btnp" style="width:100%" id="li-btn">Zaloguj się →</button>'
    + '<div class="err" id="li-err"></div>'
    + '</div>';
  $('li-btn').onclick=doLogin;
  $('li-pass').addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });
}

async function doLogin(){
  var email=($('li-email').value||'').trim(), pass=$('li-pass').value||'';
  var err=$('li-err'), btn=$('li-btn');
  if(!email||!pass){ err.textContent='Podaj e-mail i hasło.'; return; }
  btn.disabled=true; btn.textContent='Logowanie…'; err.textContent='';
  try{
    var r=await sb.auth.signInWithPassword({email:email,password:pass});
    if(r.error){ err.textContent='Błąd: '+r.error.message; btn.disabled=false; btn.textContent='Zaloguj się →'; return; }
    route();
  }catch(e){ err.textContent='Błąd logowania.'; btn.disabled=false; btn.textContent='Zaloguj się →'; }
}

function showDenied(){
  $('app').innerHTML='<div class="center"><h1>🚫 Brak dostępu</h1><div class="sub">To konto nie ma uprawnień administratora.</div><button class="btn" id="lo-btn" style="margin-top:14px">Wyloguj</button></div>';
  $('lo-btn').onclick=async function(){ try{ await sb.auth.signOut(); }catch(e){} route(); };
}

function kpiCard(label,val,color){
  return '<div class="kpi"><div class="l">'+label+'</div><div class="v"'+(color?' style="color:'+color+'"':'')+'>'+(val==null?'—':val)+'</div></div>';
}

function renderDashboard(k){
  $('app').innerHTML =
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px">'
    +  '<div><h1>📊 Statystyki</h1><div class="sub">Ruch na ogłoszeniach · tylko dla Ciebie</div></div>'
    +  '<button class="btn" id="refresh" style="flex-shrink:0">🔄</button>'
    + '</div>'
    + '<div class="kpis">'
    +   kpiCard('🟢 Online teraz', k.online, 'var(--green)')
    +   kpiCard('👁 Dziś (24h)', k.views_24h, 'var(--blue)')
    +   kpiCard('👁 Tydzień (7 dni)', k.views_7d, 'var(--blue)')
    +   kpiCard('👁 Łącznie', k.views_total, null)
    + '</div>'
    + '<input class="fi" id="q" placeholder="🔎 filtruj po nazwie / mieście">'
    + '<div class="sec"><div class="sec-h">📍 Profile fachowców <span class="cnt" id="cnt-pins"></span></div><div id="list-pins"><div class="loader">Ładowanie…</div></div></div>'
    + '<div class="sec"><div class="sec-h">📋 Zlecenia <span class="cnt" id="cnt-tenders"></span></div><div id="list-tenders"><div class="loader">Ładowanie…</div></div></div>'
    + '<div class="sec"><div class="sec-h">💼 Oferty pracy <span class="cnt" id="cnt-jobs"></span></div><div id="list-jobs"><div class="loader">Ładowanie…</div></div></div>'
    + '<div style="text-align:center;margin:10px 0 30px"><button class="btn" id="logout">Wyloguj</button></div>';
  $('refresh').onclick=function(){ route(); };
  $('logout').onclick=async function(){ try{ await sb.auth.signOut(); }catch(e){} route(); };
  $('q').addEventListener('input', applyFilter);
  loadList('pins');
  loadList('tenders');
  loadList('jobs');
  if(!window._statTimer){ window._statTimer=setInterval(refreshKpis, 30000); }
}

async function refreshKpis(){
  try{ var r=await sb.rpc('admin_get_view_kpis'); if(r&&r.data&&$('app').querySelector('.kpis')){ var ks=$('app').querySelectorAll('.kpi .v'); if(ks.length>=4){ ks[0].textContent=r.data.online; ks[1].textContent=r.data.views_24h; ks[2].textContent=r.data.views_7d; ks[3].textContent=r.data.views_total; } } }catch(e){}
}

var LIST_CFG={
  pins:   { type:'pin',    table:'pins',       sel:'id,name,role,city,is_demo,views_count', map:function(p){return{id:p.id,title:(p.name||'(bez nazwy)')+(p.is_demo?' 🎭':''),meta:[p.role,p.city].filter(Boolean).join(' · '),views:p.views_count||0};}, filter:function(q){return q.eq('is_active',true);} },
  tenders:{ type:'tender',  table:'tenders',    sel:'id,title,city,poster_name,views_count', map:function(t){return{id:t.id,title:t.title||'(bez tytułu)',meta:[t.city,t.poster_name].filter(Boolean).join(' · '),views:t.views_count||0};} },
  jobs:   { type:'job',     table:'job_offers', sel:'id,title,company_name,location,views_count', map:function(j){return{id:j.id,title:j.title||'(bez tytułu)',meta:[j.company_name,j.location].filter(Boolean).join(' · '),views:j.views_count||0};} }
};

async function loadList(key){
  var cfg=LIST_CFG[key]; var el=$('list-'+key); if(!el) return;
  var q=sb.from(cfg.table).select(cfg.sel).order('views_count',{ascending:false,nullsFirst:false}).limit(300);
  if(cfg.filter) q=cfg.filter(q);
  var r=await q;
  if(r.error){ el.innerHTML='<div class="empty" style="color:#F87171">Błąd: '+esc(r.error.message)+'</div>'; return; }
  var uniq={};
  try{ var u=await sb.rpc('admin_get_listing_unique_viewers',{p_page_type:cfg.type}); if(u&&u.data) u.data.forEach(function(x){ if(x.ref_id!=null) uniq[x.ref_id]=x.uniq||0; }); }catch(e){}
  state[key]=(r.data||[]).map(function(row){ var m=cfg.map(row); m.uniq=uniq[row.id]||0; return m; });
  expanded[key]=false;
  renderList(key);
}

function rowHtml(rank,r){
  return '<div class="row" data-s="'+esc((r.title+' '+(r.meta||'')).toLowerCase())+'">'
    +'<div class="rk">'+rank+'.</div>'
    +'<div class="mid"><div class="t">'+esc(r.title)+'</div>'+(r.meta?'<div class="m">'+esc(r.meta)+'</div>':'')+'</div>'
    +'<span class="chip u">👤 '+(r.uniq||0)+'</span>'
    +'<span class="chip b">👁 '+(r.views||0)+'</span>'
    +'</div>';
}

function renderList(key){
  var el=$('list-'+key); var rows=state[key]||[];
  var cnt=$('cnt-'+key); if(cnt) cnt.textContent = rows.length? ('· '+rows.length+' poz.') : '';
  if(!rows.length){ el.innerHTML='<div class="empty">📭 Brak danych</div>'; return; }
  var html=rows.map(function(r,i){ return rowHtml(i+1,r); }).join('');
  if(rows.length>TOP) html += '<button class="more" data-k="'+key+'">Pokaż więcej ('+(rows.length-TOP)+')</button>';
  el.innerHTML=html;
  var mb=el.querySelector('.more'); if(mb) mb.onclick=function(){ expanded[key]=!expanded[key]; applyVisibility(key); updateMoreBtn(key); };
  applyVisibility(key);
}

function applyVisibility(key){
  var el=$('list-'+key); if(!el) return;
  var qv=($('q')&&$('q').value||'').trim().toLowerCase();
  var rows=[].slice.call(el.querySelectorAll('.row'));
  var shown=0, matches=0;
  rows.forEach(function(row){
    var ok=(!qv || (row.getAttribute('data-s')||'').indexOf(qv)>=0);
    if(!ok){ row.style.display='none'; return; }
    matches++;
    var within = qv ? true : (expanded[key] || shown<TOP);
    row.style.display = within ? '' : 'none';
    if(within) shown++;
  });
  updateMoreBtn(key, qv, matches);
}

function updateMoreBtn(key, qv, matches){
  var el=$('list-'+key); if(!el) return;
  var mb=el.querySelector('.more'); if(!mb) return;
  if(qv===undefined){ qv=($('q')&&$('q').value||'').trim().toLowerCase(); matches=(state[key]||[]).length; }
  if(qv){ mb.style.display='none'; }
  else { mb.style.display=''; mb.textContent = expanded[key] ? 'Pokaż mniej' : 'Pokaż więcej ('+(matches-TOP)+')'; }
}

function applyFilter(){ ['pins','tenders','jobs'].forEach(applyVisibility); }
</script>
</body>
</html>
