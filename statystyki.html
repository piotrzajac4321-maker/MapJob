<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<meta name="robots" content="noindex,nofollow">
<title>Statystyki — MapJob</title>
<style>
:root{--bg:#080D18;--surf:#131C2D;--surf2:#1A2438;--border:rgba(255,255,255,.10);--text:#F0F4FF;--text2:#94A3B8;--text3:#5A6678;--blue:#60A5FA;--purple:#A78BFA;--green:#22C55E;--gold:#F59E0B;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px;max-width:680px;margin:0 auto;min-height:100dvh}
h1{font-size:18px;font-weight:900;margin-bottom:2px}
.sub{font-size:11px;color:var(--text3);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10px;color:var(--text3);font-weight:700}
.kpi .v{font-size:24px;font-weight:900;margin-top:3px}
.sec-h{font-size:13px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.sec-h .cnt{font-size:11px;color:var(--text3);font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.row .rk{font-size:12px;font-weight:800;color:var(--text3);min-width:24px;text-align:right}
.row .mid{flex:1;min-width:0}
.row .t{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:11px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11px;color:var(--blue);margin-top:3px;font-weight:700}
.row .s b{color:var(--purple)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:900;padding:5px 10px;border-radius:8px;flex-shrink:0;background:var(--surf);border:1px solid var(--border);color:var(--blue)}
.more{width:100%;padding:11px;margin:2px 0 16px;border-radius:10px;background:var(--surf);border:1px solid var(--border);color:var(--text2);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.btn{padding:10px 14px;border-radius:10px;background:var(--surf);border:1px solid var(--border);color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.btnp{background:linear-gradient(135deg,#2563EB,#1D6FF2);border:none;color:#fff}
.fi{width:100%;padding:11px 12px;border-radius:10px;background:var(--surf2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:14px;margin-bottom:8px}
.muted{color:var(--text3);font-size:12px;line-height:1.6}
.center{text-align:center;padding:40px 16px}
.empty{text-align:center;padding:16px;color:var(--text3);font-size:13px}
.loader{text-align:center;padding:18px;color:var(--text3);font-size:13px}
.err{color:#F87171;font-size:12px;margin-top:6px;min-height:16px}
.summary{background:linear-gradient(135deg,rgba(96,165,250,.08),rgba(96,165,250,.02));border:1px solid rgba(96,165,250,.2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.7;color:var(--text2)}
.pinrow{font-size:30px;letter-spacing:8px;text-align:center}
</style>
</head>
<body>
<div id="app"><div class="loader">Ładowanie…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL='https://ahgzjneegvptudphibdm.supabase.co';
var SB_KEY='sb_publishable__B7I_Ji4umLpI3mzW3CM6A_1YAxYmhb';
var PIN='9801';
var sb, TOP=10;
var data={ogl:[],pins:[]};
var expanded=false;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}

window.addEventListener('load', function(){
  if(typeof supabase==='undefined'){ $('app').innerHTML='<div class="center muted">Brak połączenia (biblioteka się nie załadowała). Sprawdź internet i odśwież.</div>'; return; }
  sb = supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, detectSessionInUrl:false}});
  route();
});

async function route(){
  // 1) sesja admina
  var s=null; try{ var g=await sb.auth.getSession(); s=g&&g.data&&g.data.session; }catch(e){}
  if(!s){ showLogin('Zaloguj się jako administrator.'); return; }
  // 2) PIN (lokalna blokada na czas tej karty)
  if(sessionStorage.getItem('mj_stats_pin')!=='1'){ showPin(); return; }
  // 3) weryfikacja admina + dane
  var r; try{ r=await sb.rpc('admin_get_view_kpis'); }catch(e){ r={error:{message:String(e)}}; }
  if(r.error){ if(/forbidden/i.test(r.error.message)) showDenied(); else showLogin('Sesja wygasła — zaloguj się ponownie.'); return; }
  renderDashboard(r.data);
}

function showPin(){
  $('app').innerHTML =
    '<div class="center"><h1>🔒 Statystyki</h1><div class="sub">Wpisz kod PIN</div></div>'
    + '<div style="max-width:280px;margin:0 auto">'
    + '<input class="fi pinrow" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">'
    + '<button class="btn btnp" style="width:100%" id="pin-btn">Odblokuj</button>'
    + '<div class="err" id="pin-err"></div>'
    + '<div style="text-align:center;margin-top:14px"><button class="btn" id="pin-logout" style="font-size:11px;padding:7px 12px">Wyloguj konto</button></div>'
    + '</div>';
  var inp=$('pin');
  function submit(){
    if(inp.value===PIN){ sessionStorage.setItem('mj_stats_pin','1'); route(); }
    else { $('pin-err').textContent='Błędny PIN.'; inp.value=''; inp.focus(); }
  }
  $('pin-btn').onclick=submit;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter')submit(); });
  $('pin-logout').onclick=async function(){ try{ await sb.auth.signOut(); }catch(e){} sessionStorage.removeItem('mj_stats_pin'); route(); };
  inp.focus();
}

function showLogin(msg){
  $('app').innerHTML =
    '<div class="center"><h1>📊 Statystyki MapJob</h1><div class="sub">Panel tylko dla administratora</div></div>'
    + '<div style="max-width:340px;margin:0 auto">'
    + '<div class="muted" style="margin-bottom:12px;text-align:center">'+esc(msg)+'</div>'
    + '<input class="fi" id="li-email" type="email" placeholder="E-mail admina" autocomplete="email">'
    + '<input class="fi" id="li-pass" type="password" placeholder="Hasło" autocomplete="current-password">'
    + '<button class="btn btnp" style="width:100%" id="li-btn">Zaloguj się →</button>'
    + '<div class="err" id="li-err"></div></div>';
  $('li-btn').onclick=doLogin;
  $('li-pass').addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });
}
async function doLogin(){
  var email=($('li-email').value||'').trim(), pass=$('li-pass').value||'';
  var err=$('li-err'), btn=$('li-btn');
  if(!email||!pass){ err.textContent='Podaj e-mail i hasło.'; return; }
  btn.disabled=true; btn.textContent='Logowanie…'; err.textContent='';
  try{
    var r=await sb.auth.signInWithPassword({email:email,password:pass});
    if(r.error){ err.textContent='Błąd: '+r.error.message; btn.disabled=false; btn.textContent='Zaloguj się →'; return; }
    route();
  }catch(e){ err.textContent='Błąd logowania.'; btn.disabled=false; btn.textContent='Zaloguj się →'; }
}
function showDenied(){
  $('app').innerHTML='<div class="center"><h1>🚫 Brak dostępu</h1><div class="sub">To konto nie ma uprawnień administratora.</div><button class="btn" id="lo-btn" style="margin-top:14px">Wyloguj</button></div>';
  $('lo-btn').onclick=async function(){ try{ await sb.auth.signOut(); }catch(e){} sessionStorage.removeItem('mj_stats_pin'); route(); };
}

function kpiCard(label,val,color){ return '<div class="kpi"><div class="l">'+label+'</div><div class="v"'+(color?' style="color:'+color+'"':'')+'>'+(val==null?'—':val)+'</div></div>'; }

function renderDashboard(k){
  expanded=false;
  $('app').innerHTML =
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px">'
    +  '<div><h1>📊 Statystyki</h1><div class="sub">Wejścia na stronę i ruch · tylko dla Ciebie</div></div>'
    +  '<button class="btn" id="refresh" style="flex-shrink:0">🔄</button>'
    + '</div>'
    + '<div class="kpis">'
    +   kpiCard('👥 Wejścia dziś', k.visits_24h, 'var(--blue)')
    +   kpiCard('👥 Wejścia 7 dni', k.visits_7d, 'var(--blue)')
    +   kpiCard('👥 Wejścia 30 dni', k.visits_30d, 'var(--blue)')
    +   kpiCard('🟢 Online teraz', k.online, 'var(--green)')
    + '</div>'
    + '<div class="summary" id="gen-sum">'
    +   '🧑 Unikalni odwiedzający (30 dni): <b style="color:var(--blue)">'+(k.visitors_30d!=null?k.visitors_30d:'—')+'</b><br>'
    +   '👁 Wyświetlenia ogłoszeń (30 dni): <b style="color:var(--blue)">'+(k.views_30d!=null?k.views_30d:'—')+'</b> · łącznie: <b>'+(k.views_total!=null?k.views_total:'—')+'</b>'
    + '</div>'
    + '<button class="more" id="ogl-toggle">📢 Zobacz statystyki ogłoszeń ▾</button>'
    + '<div id="ogl-wrap" style="display:none">'
    +   '<input class="fi" id="q" placeholder="🔎 filtruj po nazwie / tytule / mieście">'
    +   '<div class="sec-h">📢 Ogłoszenia <span class="cnt" id="cnt-ogl"></span></div>'
    +   '<div id="list-ogl"><div class="loader">Ładowanie…</div></div>'
    +   '<button class="more" id="more-btn" style="display:none">Pokaż więcej statystyk ▾</button>'
    +   '<div id="extra" style="display:none">'
    +     '<div class="summary" id="summary"></div>'
    +     '<div class="sec-h">📍 Profile fachowców <span class="cnt" id="cnt-pins"></span></div>'
    +     '<div id="list-pins"><div class="loader">Ładowanie…</div></div>'
    +   '</div>'
    + '</div>'
    + '<div style="text-align:center;margin:10px 0 30px"><button class="btn" id="logout">Wyloguj</button></div>';
  $('refresh').onclick=function(){ route(); };
  $('logout').onclick=async function(){ try{ await sb.auth.signOut(); }catch(e){} sessionStorage.removeItem('mj_stats_pin'); route(); };
  $('q').addEventListener('input', applyFilter);
  $('more-btn').onclick=toggleMore;
  $('ogl-toggle').onclick=toggleOgl;
  loadAll();
  if(!window._statTimer){ window._statTimer=setInterval(refreshKpis, 30000); }
}

async function refreshKpis(){
  try{ var r=await sb.rpc('admin_get_view_kpis'); if(r&&r.data){ var d=r.data; var ks=document.querySelectorAll('.kpi .v'); if(ks.length>=4){ ks[0].textContent=d.visits_24h; ks[1].textContent=d.visits_7d; ks[2].textContent=d.visits_30d; ks[3].textContent=d.online; } var gs=$('gen-sum'); if(gs) gs.innerHTML='🧑 Unikalni odwiedzający (30 dni): <b style="color:var(--blue)">'+(d.visitors_30d!=null?d.visitors_30d:'—')+'</b><br>👁 Wyświetlenia ogłoszeń (30 dni): <b style="color:var(--blue)">'+(d.views_30d!=null?d.views_30d:'—')+'</b> · łącznie: <b>'+(d.views_total!=null?d.views_total:'—')+'</b>'; } }catch(e){}
}
function toggleOgl(){ var w=$('ogl-wrap'); var open=w.style.display==='none'; w.style.display=open?'':'none'; $('ogl-toggle').textContent = open ? '📢 Ukryj statystyki ogłoszeń ▴' : '📢 Zobacz statystyki ogłoszeń ▾'; }

function mapToObj(rows,keyField){ var m={}; (rows||[]).forEach(function(x){ if(x[keyField]!=null) m[x[keyField]]=x; }); return m; }

async function loadAll(){
  try{
    var qJobs = sb.from('job_offers').select('id,title,company_name,location,views_count').order('views_count',{ascending:false,nullsFirst:false}).limit(300);
    var qTen  = sb.from('tenders').select('id,title,city,poster_name,views_count').order('views_count',{ascending:false,nullsFirst:false}).limit(300);
    var qPins = sb.from('pins').select('id,name,role,city,is_demo,views_count').eq('is_active',true).order('views_count',{ascending:false,nullsFirst:false}).limit(300);
    var res = await Promise.all([qJobs,qTen,qPins,
      sb.rpc('admin_get_listing_unique_viewers',{p_page_type:'job'}),
      sb.rpc('admin_get_listing_unique_viewers',{p_page_type:'tender'}),
      sb.rpc('admin_get_listing_unique_viewers',{p_page_type:'pin'}),
      sb.rpc('admin_get_listing_period_views',{p_page_type:'job'}),
      sb.rpc('admin_get_listing_period_views',{p_page_type:'tender'}),
      sb.rpc('admin_get_listing_period_views',{p_page_type:'pin'})
    ]);
    var jobs=res[0].data||[], tens=res[1].data||[], pins=res[2].data||[];
    var uJob=mapToObj(res[3].data,'ref_id'), uTen=mapToObj(res[4].data,'ref_id'), uPin=mapToObj(res[5].data,'ref_id');
    var pJob=mapToObj(res[6].data,'ref_id'), pTen=mapToObj(res[7].data,'ref_id'), pPin=mapToObj(res[8].data,'ref_id');
    function mk(id,title,meta,vc,um,pm,kind){ var p=pm[id]||{}; return {id:id,title:title,meta:meta,views:vc||0,uniq:(um[id]&&um[id].uniq)||0,v24h:p.v24h||0,v7d:p.v7d||0,kind:kind}; }
    var ogl = jobs.map(function(j){ return mk(j.id,'💼 '+(j.title||'(bez tytułu)'),[j.company_name,j.location].filter(Boolean).join(' · '),j.views_count,uJob,pJob,'job'); })
      .concat(tens.map(function(t){ return mk(t.id,'📋 '+(t.title||'(bez tytułu)'),[t.city,t.poster_name].filter(Boolean).join(' · '),t.views_count,uTen,pTen,'tender'); }));
    ogl.sort(function(a,b){ return (b.views||0)-(a.views||0); });
    data.ogl = ogl;
    data.pins = pins.map(function(p){ return mk(p.id,'📍 '+(p.name||'(bez nazwy)')+(p.is_demo?' 🎭':''),[p.role,p.city].filter(Boolean).join(' · '),p.views_count,uPin,pPin,'pin'); });
    renderLists();
  }catch(e){ var el=$('list-ogl'); if(el) el.innerHTML='<div class="empty" style="color:#F87171">Błąd ładowania: '+esc(String(e))+'</div>'; }
}

function rowHtml(rank,r){
  return '<div class="row" data-s="'+esc((r.title+' '+(r.meta||'')).toLowerCase())+'">'
    +'<div class="rk">'+rank+'.</div>'
    +'<div class="mid"><div class="t">'+esc(r.title)+'</div>'
    + (r.meta?'<div class="m">'+esc(r.meta)+'</div>':'')
    +'<div class="s">24h: '+(r.v24h||0)+' · 7d: '+(r.v7d||0)+' · <b>👤 '+(r.uniq||0)+'</b></div></div>'
    +'<span class="chip">👁 '+(r.views||0)+'</span>'
    +'</div>';
}

function renderLists(){
  // główny: Ogłoszenia
  var oglEl=$('list-ogl'); var ogl=data.ogl||[];
  $('cnt-ogl').textContent = ogl.length ? ('· '+ogl.length+' poz.') : '';
  oglEl.innerHTML = ogl.length ? ogl.map(function(r,i){return rowHtml(i+1,r);}).join('') : '<div class="empty">📭 Brak danych</div>';
  $('more-btn').style.display = ogl.length>TOP ? '' : 'none';
  // profile (w „więcej")
  var pinsEl=$('list-pins'); var pins=data.pins||[];
  $('cnt-pins').textContent = pins.length ? ('· '+pins.length+' poz.') : '';
  pinsEl.innerHTML = pins.length ? pins.map(function(r,i){return rowHtml(i+1,r);}).join('') : '<div class="empty">📭 Brak danych</div>';
  // podsumowanie
  var oglViews=ogl.reduce(function(s,r){return s+(r.views||0);},0);
  var pinViews=pins.reduce(function(s,r){return s+(r.views||0);},0);
  var nJob=ogl.filter(function(r){return r.kind==='job';}).length, nTen=ogl.length-nJob;
  $('summary').innerHTML='📊 <b>Podsumowanie</b><br>📢 Ogłoszenia: <b style="color:var(--blue)">'+oglViews+'</b> wyświetleń ('+nJob+' ofert pracy, '+nTen+' zleceń)<br>📍 Profile fachowców: <b style="color:var(--blue)">'+pinViews+'</b> wyświetleń ('+pins.length+' profili)';
  applyFilter();
}

function toggleMore(){
  expanded=!expanded;
  $('extra').style.display = expanded ? '' : 'none';
  $('more-btn').textContent = expanded ? 'Pokaż mniej ▴' : 'Pokaż więcej statystyk ▾';
  applyFilter();
}

function applyFilter(){
  var qv=($('q')&&$('q').value||'').trim().toLowerCase();
  // ogłoszenia: top 10 lub wszystkie (gdy expanded/filtr)
  var oglRows=[].slice.call($('list-ogl').querySelectorAll('.row'));
  var shown=0, matches=0;
  oglRows.forEach(function(row){
    var ok=(!qv || (row.getAttribute('data-s')||'').indexOf(qv)>=0);
    if(!ok){ row.style.display='none'; return; }
    matches++;
    var within = qv ? true : (expanded || shown<TOP);
    row.style.display = within ? '' : 'none';
    if(within) shown++;
  });
  var mb=$('more-btn');
  if(mb && (data.ogl||[]).length>TOP){
    if(qv){ mb.style.display='none'; }
    else { mb.style.display=''; mb.textContent = expanded ? 'Pokaż mniej ▴' : 'Pokaż więcej statystyk ▾'; }
  }
  // przy filtrze pokaż też sekcję „więcej" (profile) z dopasowaniami
  if(qv){ $('extra').style.display=''; }
  else if(!expanded){ $('extra').style.display='none'; }
  // profile: filtr (bez limitu — to już sekcja rozwinięta)
  [].slice.call($('list-pins').querySelectorAll('.row')).forEach(function(row){
    var ok=(!qv || (row.getAttribute('data-s')||'').indexOf(qv)>=0);
    row.style.display = ok ? '' : 'none';
  });
}
</script>
</body>
</html>
