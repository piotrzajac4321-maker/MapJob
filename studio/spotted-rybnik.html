<!DOCTYPE html>

<head>

<title>Generator grafik — Spotted Rybnik</title>
<style>
  :root{--graf:#15171c;--gold:#c9a24b;--line:#2a2d34;--card:#1d2026}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8e6df;line-height:1.5}
  header{background:var(--graf);color:var(--gold);padding:20px 18px;text-align:center;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:20px;letter-spacing:3px}
  header p{margin:6px 0 0;font-size:13px;color:#9aa0a6}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:13px;margin:0 0 6px;color:#cfcabb}
  textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#12141a;color:#e8e6df;font-family:inherit}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  button{cursor:pointer;border:none;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700}
  .gold{background:var(--gold);color:#15171c}.gold:hover{background:#dab863}
  .ghost{background:#2a2d34;color:#e8e6df}
  .hint{font-size:12px;color:#8a9096;margin-top:6px}
  .preview{text-align:center;background:#000;border:1px solid var(--line);border-radius:12px;padding:12px}
  canvas{max-width:100%;height:auto;border-radius:8px;cursor:pointer}
  .tag{display:inline-block;background:#2a2d34;color:var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
  a.back{color:var(--gold);font-size:14px;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>SPOTTED RYBNIK</h1>
  <p>Generator grafik na posty · 4:5 · grafit i złoto</p>
</header>

<div class="wrap">
  <div style="margin-bottom:12px"><a class="back" href="bobo-generator.html">← Wróć do generatora BoboFoto</a></div>

  <div class="card">
    <span class="tag">TWOJE WIADOMOŚCI</span>
    <label>Ile ogłoszeń (kafelków)</label>
    <select id="count" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#12141a;color:#e8e6df;margin-bottom:12px">
      <option value="1">1</option><option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5" selected>5</option><option value="6">6</option>
    </select>
    <label>Wklej wiadomości — każda w nowej linii</label>
    <textarea id="msgs"></textarea>
    <div class="btns">
      <button class="gold" onclick="losuj()">🎲 Losuj z bazy (100)</button>
      <button class="ghost" onclick="draw()">🔄 Odśwież podgląd</button>
    </div>
    <div class="hint">💡 <b>Kliknij dowolny kafelek na podglądzie</b> → wskoczy w niego inne, losowe ogłoszenie. Liczniki i układ ustawiają się same.</div>
  </div>

  <div class="btns">
    <button class="gold" onclick="dl()">⬇️ Pobierz PNG (4:5)</button>
  </div>

  <div class="card">
    <span class="tag">PODGLĄD</span>
    <div class="preview"><canvas id="cv" width="1080" height="1350"></canvas></div>
  </div>
</div>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1080,H=1350,GOLD="#c9a24b",GRAF="#15171c",TILE="#1d2026";
const ta=document.getElementById('msgs');

let current=[];
let tileRects=[];
function Nv(){return +((document.getElementById('count')||{}).value||5);}
function syncTA(){ta.value=current.join("\n");}
function syncFromTA(){current=ta.value.split("\n").map(s=>s.trim()).filter(Boolean);draw();}
function randUnused(){const a=MSGS.filter(m=>!current.includes(m));const p=a.length?a:MSGS;return p[Math.floor(Math.random()*p.length)];}
function losuj(){const n=Nv();const pool=[...MSGS];current=[];for(let i=0;i<n;i++)current.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);syncTA();draw();}
function setCount(){const n=Nv();if(current.length>n)current=current.slice(0,n);else while(current.length<n)current.push(randUnused());syncTA();draw();}
function getMsgs(){const n=Nv();const a=current.slice(0,n);while(a.length<n)a.push("…");return a;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(t,maxW){const words=t.split(" ");let l=[],c="";for(const w of words){const tt=c?c+" "+w:w;if(ctx.measureText(tt).width>maxW&&c){l.push(c);c=w;}else c=tt;}if(c)l.push(c);return l;}
function fit(t,maxW,maxH){for(let fs=36;fs>=16;fs-=2){ctx.font="500 "+fs+"px system-ui,Segoe UI,Roboto,sans-serif";const ls=wrap(t,maxW);if(ls.length*fs*1.28<=maxH)return{fs,ls,lh:fs*1.28};}ctx.font="500 16px system-ui,Segoe UI,Roboto,sans-serif";return{fs:16,ls:wrap(t,maxW),lh:21};}

function tile(x,y,w,h,num,text){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=22;ctx.shadowOffsetY=8;
  ctx.fillStyle=TILE; rr(x,y,w,h,26); ctx.fill();
  ctx.restore();
  ctx.strokeStyle="rgba(201,162,75,0.55)";ctx.lineWidth=2; rr(x,y,w,h,26); ctx.stroke();
  // marker
  const m=52, mx=x+20, my=y+20;
  ctx.fillStyle=GOLD; rr(mx,my,m,m,12); ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 30px system-ui,Segoe UI,Roboto,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(num, mx+m/2, my+m/2+1);
  // text (centered in area below marker)
  const padX=34, topPad=92, botPad=24;
  const aw=w-padX*2, ah=h-topPad-botPad;
  const f=fit(text,aw,ah);
  ctx.font="500 "+f.fs+"px system-ui,Segoe UI,Roboto,sans-serif";
  ctx.fillStyle="#f2efe6";ctx.textAlign="center";ctx.textBaseline="alphabetic";
  const blockH=f.ls.length*f.lh;
  let ty=y+topPad+(ah-blockH)/2+f.fs;
  f.ls.forEach(line=>{ctx.fillText(line,x+w/2,ty);ty+=f.lh;});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // tło grafit
  ctx.fillStyle=GRAF; ctx.fillRect(0,0,W,H);
  // poświaty w narożnikach
  let g1=ctx.createRadialGradient(60,60,0,60,60,520); g1.addColorStop(0,"rgba(201,162,75,0.14)");g1.addColorStop(1,"rgba(201,162,75,0)");
  ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  let g2=ctx.createRadialGradient(W-60,H-60,0,W-60,H-60,560); g2.addColorStop(0,"rgba(201,162,75,0.10)");g2.addColorStop(1,"rgba(201,162,75,0)");
  ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  // nagłówek złoty
  const gg=ctx.createLinearGradient(0,60,0,140);gg.addColorStop(0,"#ecd28a");gg.addColorStop(0.5,"#c9a24b");gg.addColorStop(1,"#9c7c34");
  ctx.fillStyle=gg;ctx.font="bold 66px system-ui,Segoe UI,Roboto,sans-serif";ctx.textAlign="center";ctx.textBaseline="alphabetic";
  try{ctx.letterSpacing="12px";}catch(e){}
  ctx.fillText("SPOTTED RYBNIK",W/2,120);
  try{ctx.letterSpacing="0px";}catch(e){}
  // złota kreska
  ctx.fillStyle=GOLD; rr(W/2-90,150,180,5,3); ctx.fill();
  // podtytuł
  ctx.fillStyle="#9aa0a6";ctx.font="27px system-ui,Segoe UI,Roboto,sans-serif";
  ctx.fillText("Odnieś się w komentarzu, podając numer zgłoszenia",W/2,205);
  // kafelki (dynamiczna liczba 1–6)
  const msgs=getMsgs();
  const n=msgs.length;
  const pad=60,colGap=30,gap=26;
  const colW=(W-pad*2-colGap)/2;
  const contentTop=255, contentBottom=H-92;
  const rows=Math.ceil(n/2);
  const rowH=(contentBottom-contentTop-(rows-1)*gap)/rows;
  const x2=pad+colW+colGap;
  tileRects=[];
  let idx=0;
  for(let r=0;r<rows;r++){
    const y=contentTop+r*(rowH+gap);
    const lastOdd=(r===rows-1)&&((n-idx)===1);
    if(lastOdd){
      tile(pad,y,W-pad*2,rowH,idx+1,msgs[idx]); tileRects.push({x:pad,y,w:W-pad*2,h:rowH,i:idx}); idx++;
    } else {
      tile(pad,y,colW,rowH,idx+1,msgs[idx]); tileRects.push({x:pad,y,w:colW,h:rowH,i:idx}); idx++;
      if(idx<n){ tile(x2,y,colW,rowH,idx+1,msgs[idx]); tileRects.push({x:x2,y,w:colW,h:rowH,i:idx}); idx++; }
    }
  }
  // stopka
  ctx.font="24px system-ui,Segoe UI,Roboto,sans-serif";ctx.textBaseline="alphabetic";
  const s1="Spotted Rybnik",s2=" · swoje zgłoszenie wyślij w wiadomości prywatnej";
  const w1=ctx.measureText(s1).width,w2=ctx.measureText(s2).width;
  const sx=(W-(w1+w2))/2;
  ctx.textAlign="left";
  ctx.fillStyle=GOLD;ctx.fillText(s1,sx,H-44);
  ctx.fillStyle="#8a9096";ctx.fillText(s2,sx+w1,H-44);
  ctx.textAlign="center";
}

function dl(){
  draw();
  function viaData(){const a=document.createElement('a');a.href=cv.toDataURL("image/png");a.download="spotted-rybnik.png";document.body.appendChild(a);a.click();a.remove();}
  try{
    if(cv.toBlob){
      cv.toBlob(function(b){
        if(!b){viaData();return;}
        const a=document.createElement('a');const url=URL.createObjectURL(b);
        a.href=url;a.download="spotted-rybnik.png";document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
      },"image/png");
    } else { viaData(); }
  }catch(e){ viaData(); }
}

current=[
"Komu wpadł telefon w sobotę wieczorem na Rynku? Mam go u siebie, odezwij się!",
"Szukam fryzjera w Rybniku, który ogarnie koloryzację. Kogo polecacie?",
"Zgubił się rudy kot w okolicy Nowin, bardzo płochliwy. Widział go ktoś?",
"Jesteśmy dwie i siedzimy dziś w Rybniku bez planu, co polecacie na wieczór?",
"Oddam za darmo kanapę w dobrym stanie, odbiór własny z Boguszowic."
];
syncTA();
ta.addEventListener('input',syncFromTA);
document.getElementById('count').addEventListener('change',setCount);
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height;
  const px=(e.clientX-r.left)*sx, py=(e.clientY-r.top)*sy;
  for(const t of tileRects){
    if(px>=t.x&&px<=t.x+t.w&&py>=t.y&&py<=t.y+t.h){ current[t.i]=randUnused(); syncTA(); draw(); break; }
  }
});
draw();
</script>
</body>
