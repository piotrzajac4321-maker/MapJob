<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Cennik reklamy — Spotted Rybnik</title>
<style>
  :root{--graf:#15171c;--gold:#c9a24b;--line:#2a2d34;--card:#1d2026;--mut:#8a9096}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8e6df;line-height:1.5}
  header{background:var(--graf);color:var(--gold);padding:20px 18px;text-align:center;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:20px;letter-spacing:3px}
  header p{margin:6px 0 0;font-size:13px;color:#9aa0a6}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:13px;margin:10px 0 6px;color:#cfcabb}
  textarea{width:100%;min-height:220px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#12141a;color:#e8e6df;font-family:inherit;line-height:1.6}
  input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#12141a;color:#e8e6df;font-family:inherit}
  select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#12141a;color:#e8e6df}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  button{cursor:pointer;border:none;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700}
  .gold{background:var(--gold);color:#15171c}.gold:hover{background:#dab863}
  .ghost{background:#2a2d34;color:#e8e6df}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .preview{text-align:center;background:#000;border:1px solid var(--line);border-radius:12px;padding:12px}
  canvas{max-width:100%;height:auto;border-radius:8px}
  .tag{display:inline-block;background:#2a2d34;color:var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
  a.back{color:var(--gold);font-size:14px;text-decoration:none}
  .row2{display:flex;gap:12px}.row2>div{flex:1}
</style>
</head>
<body>
<header>
  <h1>SPOTTED RYBNIK</h1>
  <p>Generator cennika reklamy · czarno-złoty premium</p>
</header>

<div class="wrap">
  <div style="margin-bottom:12px"><a class="back" href="spotted-rybnik.html">← Wróć do generatora grafik</a></div>

  <div class="card">
    <span class="tag">TREŚĆ CENNIKA</span>
    <label>Nagłówek</label>
    <input type="text" id="hdr" value="CENNIK REKLAMY">
    <label>Podtytuł</label>
    <input type="text" id="sub" value="Reklama w Spotted Rybnik">
    <label>Pozycje cennika
      <span class="hint" style="font-weight:400"> — każda linia: <b>Nazwa | Cena</b> · linia z <b>#</b> na początku = nagłówek sekcji · pusta linia = odstęp</span>
    </label>
    <textarea id="rows"># UDOSTĘPNIENIA
Facebook + Instagram | 50 zł
Facebook + Instagram + Relacje | 70 zł

# PAKIETY
Pakiet 10 udostępnień (bez relacji) | 350 zł
Pakiet 10 udostępnień (z relacjami) | 500 zł

# ABONAMENT
Stała obecność co tydzień | indywidualnie
Pakiet roczny — najniższa cena za post | indywidualnie</textarea>
    <div class="row2">
      <div><label>CTA (banner na dole)</label><input type="text" id="cta" value="ZAREKLAMUJ SIĘ U NAS · POWIĘKSZ ZASIĘGI"></div>
    </div>
    <label>Stopka (zasięgi / kontakt)</label>
    <input type="text" id="foot" value="Facebook 11 700+  ·  Instagram 7 900+  ·  napisz w wiadomości albo komentarzu">
  </div>

  <div class="card">
    <span class="tag">WYGLĄD</span>
    <div class="row2">
      <div><label>Kolorystyka</label>
        <select id="theme"><option value="czarny" selected>Czarny premium</option><option value="bialy">Biały premium</option></select>
      </div>
      <div><label>Format</label>
        <select id="fmt"><option value="45" selected>4:5 (post)</option><option value="11">1:1 (kwadrat)</option><option value="916">9:16 (relacja)</option></select>
      </div>
    </div>
    <label style="margin-top:12px">Wielkość napisów</label>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:13px">A</span>
      <input type="range" id="tsize" min="0" max="3" step="1" value="1" style="flex:1;accent-color:#caa64a">
      <span style="font-size:20px;font-weight:700">A</span>
    </div>
  </div>

  <div class="btns">
    <button class="gold" onclick="dl()">⬇️ Pobierz PNG</button>
    <button class="ghost" onclick="draw()">🔄 Odśwież podgląd</button>
  </div>
  <div class="hint" id="info"></div>
  <div id="exp"></div>

  <div class="card">
    <span class="tag">PODGLĄD</span>
    <div class="preview"><canvas id="cv" width="1080" height="1350"></canvas></div>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const FF="system-ui,Segoe UI,Roboto,sans-serif";
const THEMES={
  czarny:{bg:"#111318",glow:"201,162,75",card:"rgba(255,255,255,0.04)",cardB:"rgba(201,162,75,0.28)",gold:"#e2c079",sub:"#b9bcc4",name:"#f0eee6",price:"#e2c079",sect:"#e2c079",foot:"#8f949c",cta:"#e2c079",ctaT:"#15171c",g1:"#f6e7bf",g2:"#d8b25e",g3:"#b98f38"},
  bialy:{bg:"#f4f1ea",glow:"180,140,60",card:"rgba(0,0,0,0.03)",cardB:"rgba(160,120,40,0.30)",gold:"#9c7a2c",sub:"#5b5f66",name:"#1b1d22",price:"#9c7a2c",sect:"#9c7a2c",foot:"#7a7f86",cta:"#9c7a2c",ctaT:"#fff",g1:"#8a6a24",g2:"#a9862f",g3:"#7c5f1e"}
};
let W=1080,H=1350,T=THEMES.czarny;
function scale(){return ({0:0.86,1:1,2:1.14,3:1.28})[+document.getElementById('tsize').value]||1;}
function fmt(){const v=document.getElementById('fmt').value;if(v==="11")return[1080,1080];if(v==="916")return[1080,1920];return[1080,1350];}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function parseRows(){
  return document.getElementById('rows').value.split(/\n/).map(l=>{
    const s=l.trim();
    if(s==="")return{t:"gap"};
    if(s[0]==="#")return{t:"sect",name:s.replace(/^#+\s*/,"").toUpperCase()};
    const i=s.lastIndexOf("|");
    if(i<0)return{t:"row",name:s,price:""};
    return{t:"row",name:s.slice(0,i).trim(),price:s.slice(i+1).trim()};
  });
}

function draw(){
  const d=fmt();W=d[0];H=d[1];cv.width=W;cv.height=H;
  T=THEMES[document.getElementById('theme').value]||THEMES.czarny;
  const sc=scale();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=T.bg;ctx.fillRect(0,0,W,H);
  // glow
  let g1=ctx.createRadialGradient(80,80,0,80,80,560);g1.addColorStop(0,"rgba("+T.glow+",0.16)");g1.addColorStop(1,"rgba("+T.glow+",0)");
  ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  let g2=ctx.createRadialGradient(W-80,H-80,0,W-80,H-80,600);g2.addColorStop(0,"rgba("+T.glow+",0.12)");g2.addColorStop(1,"rgba("+T.glow+",0)");
  ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  // outer frame
  ctx.strokeStyle="rgba("+T.glow+",0.35)";ctx.lineWidth=2;rr(28,28,W-56,H-56,22);ctx.stroke();

  // header
  const hdr=(document.getElementById('hdr').value||"CENNIK").trim();
  const sub=document.getElementById('sub').value.trim();
  const gg=ctx.createLinearGradient(0,60,0,150);gg.addColorStop(0,T.g1);gg.addColorStop(0.5,T.g2);gg.addColorStop(1,T.g3);
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.fillStyle=T.sub;ctx.font="600 26px "+FF;try{ctx.letterSpacing="6px";}catch(e){}
  ctx.fillText("SPOTTED RYBNIK",W/2,105);try{ctx.letterSpacing="0px";}catch(e){}
  ctx.fillStyle=gg;let hs=76;try{ctx.letterSpacing="3px";}catch(e){}
  ctx.font="bold "+hs+"px "+FF;while(ctx.measureText(hdr).width>W-160&&hs>34){hs-=2;ctx.font="bold "+hs+"px "+FF;}
  ctx.fillText(hdr,W/2,185);try{ctx.letterSpacing="0px";}catch(e){}
  ctx.fillStyle=T.gold;rr(W/2-70,206,140,5,3);ctx.fill();
  if(sub){ctx.fillStyle=T.sub;ctx.font="italic 30px "+FF;ctx.fillText(sub,W/2,258);}

  // rows area
  const items=parseRows();
  const topY=300, botReserve=(document.getElementById('cta').value.trim()?150:70)+70;
  const areaTop=topY, areaBot=H-botReserve;
  const px=80, pw=W-px*2;
  // measure weighted units: row=1, sect=1.15, gap=0.5
  let units=0;items.forEach(it=>{units+=it.t==="row"?1:it.t==="sect"?1.15:0.5;});
  units=Math.max(units,1);
  let unit=(areaBot-areaTop)/units;
  const maxUnit=118*sc;if(unit>maxUnit)unit=maxUnit;
  let y=areaTop;
  const rowFs=Math.min(40,unit*0.42)*sc;
  const priceFs=rowFs*1.02;
  const sectFs=Math.min(30,unit*0.36)*sc;
  items.forEach(it=>{
    if(it.t==="gap"){y+=unit*0.5;return;}
    if(it.t==="sect"){
      const h=unit*1.15;const cy=y+h/2;
      ctx.textAlign="left";ctx.textBaseline="middle";
      ctx.fillStyle=T.sect;ctx.font="bold "+sectFs+"px "+FF;try{ctx.letterSpacing="3px";}catch(e){}
      ctx.fillText(it.name,px,cy+2);try{ctx.letterSpacing="0px";}catch(e){}
      const tw=ctx.measureText(it.name).width+8;
      ctx.strokeStyle="rgba("+T.glow+",0.35)";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(px+tw,cy);ctx.lineTo(px+pw,cy);ctx.stroke();
      y+=h;return;
    }
    // row
    const h=unit;const cy=y+h/2;
    ctx.save();ctx.fillStyle=T.card;rr(px,y+h*0.08,pw,h*0.84,14);ctx.fill();
    ctx.strokeStyle=T.cardB;ctx.lineWidth=1.2;rr(px,y+h*0.08,pw,h*0.84,14);ctx.stroke();ctx.restore();
    ctx.textBaseline="middle";
    // price first (right)
    ctx.textAlign="right";ctx.fillStyle=T.price;ctx.font="bold "+priceFs+"px "+FF;
    const priceW=it.price?ctx.measureText(it.price).width:0;
    if(it.price)ctx.fillText(it.price,px+pw-26,cy);
    // name (left, wrap to available width)
    ctx.textAlign="left";ctx.fillStyle=T.name;ctx.font="600 "+rowFs+"px "+FF;
    const nameMax=pw-52-priceW-30;
    let name=it.name;
    if(ctx.measureText(name).width>nameMax){while(name.length>4&&ctx.measureText(name+"…").width>nameMax)name=name.slice(0,-1);name+="…";}
    ctx.fillText(name,px+26,cy);
    y+=h;
  });

  // CTA banner
  const cta=document.getElementById('cta').value.trim();
  let by=H-botReserve+20;
  if(cta){
    const bh=78;const bw=W-px*2;
    ctx.save();ctx.fillStyle=T.cta;rr(px,by,bw,bh,16);ctx.fill();ctx.restore();
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=T.ctaT;
    let cfs=30*sc;ctx.font="bold "+cfs+"px "+FF;while(ctx.measureText(cta).width>bw-40&&cfs>18){cfs-=1;ctx.font="bold "+cfs+"px "+FF;}
    ctx.fillText(cta,W/2,by+bh/2+1);
    by+=bh+18;
  }
  // footer
  const foot=document.getElementById('foot').value.trim();
  if(foot){
    ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillStyle=T.foot;
    let ffs=25;ctx.font=ffs+"px "+FF;while(ctx.measureText(foot).width>W-120&&ffs>16){ffs-=1;ctx.font=ffs+"px "+FF;}
    ctx.fillText(foot,W/2,H-52);
  }
}

function dl(){
  draw();
  const info=document.getElementById('info');
  cv.toBlob(b=>{
    if(b){const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download="cennik-spotted-rybnik.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
    // zawsze pokaż też obraz do ręcznego zapisu (mobile)
    const exp=document.getElementById('exp');
    exp.innerHTML='<div class="hint" style="margin:8px 0">📱 Na telefonie: przytrzymaj obraz poniżej i wybierz „Zapisz".</div>';
    const im=new Image();im.src=cv.toDataURL('image/png');im.style.maxWidth="100%";im.style.borderRadius="8px";exp.appendChild(im);
    if(info){info.textContent="Pobrano PNG ✓";setTimeout(()=>info.textContent="",2500);}
  },'image/png');
}

['hdr','sub','rows','cta','foot'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
['theme','fmt'].forEach(id=>document.getElementById(id).addEventListener('change',draw));
document.getElementById('tsize').addEventListener('input',draw);
draw();
</script>
</body>
</html>
