<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cookie banner — preview</title>
<style>
  :root{
    --bg:#0A1018; --bg2:#0F1620;
    --text:#F4F4F5; --text2:#D4D4D8; --text3:#6B7280;
    --border3:rgba(255,255,255,.12);
    --blue:#2563EB; --blue2:#60A5FA;
  }
  html,body{margin:0;height:100%;background:#0A1018;color:#F4F4F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .mock-map{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(96,165,250,.10), transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(167,139,250,.08), transparent 50%),
      linear-gradient(180deg,#0a1018,#0F1620);
  }
  .mock-map::after{
    content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:48px 48px;
  }
  .mock-pin{position:absolute;width:18px;height:24px;border-radius:9px 9px 9px 0;background:#2563EB;transform:rotate(-45deg);box-shadow:0 4px 12px rgba(37,99,235,.4)}
  .mock-pin.b{background:#22C55E;box-shadow:0 4px 12px rgba(34,197,94,.4)}
  .mock-pin.c{background:#F59E0B;box-shadow:0 4px 12px rgba(245,158,11,.4)}
  .mock-pin.d{background:#A78BFA;box-shadow:0 4px 12px rgba(167,139,250,.4)}
  .mock-header{
    position:fixed;top:0;left:0;right:0;height:56px;
    background:rgba(15,22,32,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;padding:0 18px;z-index:10
  }
  .mock-logo{font-weight:900;font-size:18px;letter-spacing:-.5px}
  .mock-logo span:first-child{color:#F4F4F5}
  .mock-logo span:last-child{color:#60A5FA}
  .label{position:fixed;left:20px;top:80px;font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:1px;font-weight:700;z-index:11}
</style>
</head>
<body>

<div class="mock-map">
  <div class="mock-pin"   style="top:25%;left:18%"></div>
  <div class="mock-pin b" style="top:40%;left:34%"></div>
  <div class="mock-pin c" style="top:55%;left:52%"></div>
  <div class="mock-pin d" style="top:30%;left:68%"></div>
  <div class="mock-pin"   style="top:62%;left:78%"></div>
  <div class="mock-pin b" style="top:48%;left:14%"></div>
  <div class="mock-pin c" style="top:22%;left:55%"></div>
  <div class="mock-pin d" style="top:38%;left:84%"></div>
</div>

<div class="mock-header">
  <div class="mock-logo"><span>Map</span><span>Job</span></div>
</div>

<div class="label">Podgląd: cookie banner</div>

<!-- IDENTYCZNY MARKUP CO W index.html (wklejony 1:1) -->
<div id="cookie-banner" style="display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:20px;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <div style="width:100%;max-width:420px;background:var(--bg2,#0F1620);border:1px solid var(--border3,rgba(255,255,255,.12));border-radius:16px;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.55);pointer-events:auto">
    <div style="font-size:15px;font-weight:700;color:var(--text,#F4F4F5);margin-bottom:6px">Pliki cookie</div>
    <div style="font-size:13px;line-height:1.55;color:var(--text2,#D4D4D8);margin-bottom:16px">
      Używamy ich do analizy ruchu i ulepszania MapJob.
      <button style="background:none;border:none;padding:0;color:var(--blue2,#60A5FA);font:inherit;cursor:pointer;text-decoration:underline">Polityka prywatności</button>
      <span style="color:var(--text3,#6B7280);margin:0 2px">·</span>
      <button style="background:none;border:none;padding:0;color:var(--blue2,#60A5FA);font:inherit;cursor:pointer;text-decoration:underline">Ustawienia</button>
    </div>
    <div style="display:flex;gap:8px">
      <button style="flex:1;padding:11px 14px;border-radius:10px;background:transparent;border:1px solid var(--border3,rgba(255,255,255,.18));font-family:inherit;font-size:13px;font-weight:600;color:var(--text2,#D4D4D8);cursor:pointer;white-space:nowrap">Tylko niezbędne</button>
      <button style="flex:1;padding:11px 14px;border-radius:10px;background:var(--blue,#2563EB);border:none;font-family:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap">Akceptuję</button>
    </div>
  </div>
</div>

</body>
</html>
