<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapJob — Zaufali Nam (Wariant C)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080D18;
      color: #F0F4FF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 0 48px;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Dev label */
    .note {
      background: linear-gradient(90deg, #1D6FF2, #00B8D9);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-align: center;
      padding: 6px 12px;
      border-radius: 6px;
      margin: 0 16px 20px;
      text-transform: uppercase;
    }

    /* ── FAKE MAP ────────────────────────────────────────── */
    .map-section {
      position: relative;
      height: 220px;
      background: #0e1a2e;
      border-radius: 20px;
      margin: 0 16px;
      overflow: hidden;
    }

    .map-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .map-section::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(120deg, transparent 30%, rgba(255,255,255,.06) 30%, rgba(255,255,255,.06) 31%, transparent 31%),
        linear-gradient(60deg, transparent 45%, rgba(255,255,255,.05) 45%, rgba(255,255,255,.05) 46%, transparent 46%),
        linear-gradient(90deg, transparent 55%, rgba(255,255,255,.04) 55%, rgba(255,255,255,.04) 57%, transparent 57%);
    }

    .cluster {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 0 0 3px rgba(29,111,242,.35), 0 4px 16px rgba(0,0,0,.5);
      z-index: 2;
    }
    .cluster-lg {
      width: 52px; height: 52px;
      background: #1D6FF2;
      font-size: 16px;
    }
    .cluster-md {
      width: 40px; height: 40px;
      background: #0fa0c8;
    }
    .cluster-sm {
      width: 32px; height: 32px;
      background: #00B8D9;
      font-size: 11px;
    }
    .c1 { top: 50px;  left: 60px; }
    .c2 { top: 30px;  right: 70px; }
    .c3 { top: 110px; right: 100px; }
    .c4 { top: 130px; left: 130px; }

    .c1::before {
      content: '';
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(29,111,242,.4);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(.7); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .map-btn {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.18);
      color: #F0F4FF;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      letter-spacing: .02em;
    }

    /* ── ZAUFALI NAM SECTION ─────────────────────────────── */
    .trusted-section {
      padding: 32px 16px 28px;
    }

    .section-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-eyebrow span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      color: #00B8D9;
      text-transform: uppercase;
    }
    .eyebrow-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(0,184,217,.4), transparent);
    }

    .section-headline {
      font-size: 23px;
      font-weight: 800;
      color: #F0F4FF;
      line-height: 1.22;
      margin-bottom: 5px;
      letter-spacing: -.025em;
    }

    .section-subtext {
      font-size: 13px;
      color: #8A94A8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* ── COMPACT 4-LOGO ROW ─────────────────────────────── */
    .logo-row {
      display: flex;
      gap: 9px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .logo-card-sm {
      flex: 1;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 14px rgba(0,0,0,.2);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      min-width: 0;
    }

    .logo-card-sm svg {
      display: block;
      height: 22px;
      width: 100%;
    }

    /* ── TESTIMONIAL CARD ───────────────────────────────── */
    .testimonial-card {
      background: #111827;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 22px 20px 20px;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }

    /* Subtle top-left accent line */
    .testimonial-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 2px;
      background: linear-gradient(90deg, #1D6FF2, #00B8D9, transparent);
      border-radius: 0 0 2px 2px;
    }

    .quote-icon {
      font-size: 52px;
      line-height: 1;
      color: #1D6FF2;
      opacity: .35;
      font-family: Georgia, serif;
      position: absolute;
      top: 14px;
      left: 18px;
      pointer-events: none;
      user-select: none;
    }

    .quote-text {
      font-size: 14px;
      color: #CBD5E1;
      line-height: 1.65;
      padding-top: 18px;
      padding-left: 4px;
      font-style: italic;
      letter-spacing: .01em;
      margin-bottom: 18px;
    }

    .quote-attribution {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1D6FF2 0%, #00B8D9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.02em;
    }

    .attribution-text {
      flex: 1;
      min-width: 0;
    }

    .attribution-name {
      font-size: 14px;
      font-weight: 700;
      color: #F0F4FF;
      margin-bottom: 2px;
    }

    .attribution-role {
      font-size: 11.5px;
      color: #8A94A8;
      line-height: 1.3;
    }

    /* Verified badge */
    .verified-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(29,111,242,.12);
      border: 1px solid rgba(29,111,242,.25);
      border-radius: 999px;
      padding: 3px 10px 3px 6px;
      font-size: 10px;
      font-weight: 600;
      color: #93B4FF;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .verified-chip svg {
      width: 12px;
      height: 12px;
    }

    /* ── BOTTOM CTA LINK ─────────────────────────────────── */
    .cta-link-wrap {
      text-align: center;
      margin: 0 16px;
      padding: 16px 0 8px;
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #1D6FF2;
      text-decoration: none;
      border-bottom: 1px solid rgba(29,111,242,.3);
      padding-bottom: 2px;
      letter-spacing: .01em;
      transition: color .2s;
    }

    .cta-link .arrow {
      font-size: 16px;
      font-style: normal;
    }
  </style>
</head>
<body>
  <div class="phone-frame">

    <div class="note">MAKIETA C — wariant Premium z rekomendacją</div>

    <!-- FAKE MAP -->
    <div class="map-section">
      <div class="cluster cluster-lg c1">44</div>
      <div class="cluster cluster-md c2">9</div>
      <div class="cluster cluster-sm c3">3</div>
      <div class="cluster cluster-sm c4">6</div>
      <button class="map-btn">Otwórz pełną mapę</button>
    </div>

    <!-- ZAUFALI NAM -->
    <section class="trusted-section">

      <div class="section-eyebrow">
        <span>Zaufali nam</span>
        <div class="eyebrow-line"></div>
      </div>

      <h2 class="section-headline">Rekruterzy nam ufają</h2>
      <p class="section-subtext">Zobacz, kto już rekrutuje z MapJob</p>

      <!-- 4 COMPACT LOGOS IN A ROW -->
      <div class="logo-row">

        <!-- JobWerke -->
        <div class="logo-card-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" role="img" aria-label="JobWerke" preserveAspectRatio="xMidYMid meet">
            <rect x="2" y="10" width="6" height="20" rx="3" fill="#1D6FF2"/>
            <text x="14" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#111827">Job</text>
            <text x="56" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="300" fill="#1D6FF2">Werke</text>
          </svg>
        </div>

        <!-- Pramer -->
        <div class="logo-card-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" role="img" aria-label="Pramer" preserveAspectRatio="xMidYMid meet">
            <circle cx="12" cy="20" r="7" fill="#00B8D9" opacity=".9"/>
            <text x="26" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#111827">pramer</text>
          </svg>
        </div>

        <!-- Nordic HR -->
        <div class="logo-card-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" role="img" aria-label="Nordic HR" preserveAspectRatio="xMidYMid meet">
            <text x="80" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">NORDIC</text>
            <text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="300" fill="#1D6FF2" text-anchor="middle">HR</text>
          </svg>
        </div>

        <!-- ProWork -->
        <div class="logo-card-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" role="img" aria-label="ProWork" preserveAspectRatio="xMidYMid meet">
            <text x="75" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Pro<tspan fill="#00B8D9">Work</tspan></text>
          </svg>
        </div>

      </div><!-- /.logo-row -->

      <!-- TESTIMONIAL CARD -->
      <div class="testimonial-card">
        <div class="quote-icon" aria-hidden="true">&ldquo;</div>

        <p class="quote-text">
          MapJob to jedyne narzędzie, gdzie kandydaci sami do nas trafiają&nbsp;— dosłownie z&nbsp;mapy.
        </p>

        <div class="quote-attribution">
          <div class="avatar" aria-hidden="true">MK</div>
          <div class="attribution-text">
            <div class="attribution-name">Marta K.</div>
            <div class="attribution-role">HR Manager, JobWerke</div>
          </div>
          <div class="verified-chip">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" stroke="#93B4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Zweryfikowana
          </div>
        </div>
      </div><!-- /.testimonial-card -->

    </section>

    <!-- BOTTOM CTA LINK -->
    <div class="cta-link-wrap">
      <a href="#" class="cta-link">
        Dołącz do nich&nbsp;— bezpłatnie
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>

  </div><!-- /.phone-frame -->
</body>
</html>
