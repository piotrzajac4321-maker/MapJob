# Publikuje stronę z katalogu studio-ai na GitHub Pages.
name: Deploy Studio AI to GitHub Pages

on:
  push:
    branches:
      - claude/blissful-faraday-8aJHZ
    paths:
      - "studio-ai/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site (studio-ai)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./studio-ai

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
