<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Raport zasięgów reklamy — Spotted Rybnik</title>
<style>
  :root{--gold:#c9a24b;--line:#2a2d34;--card:#1d2026;--mut:#8a9096}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8e6df;line-height:1.5}
  header{background:#15171c;color:var(--gold);padding:20px 18px;text-align:center;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:20px;letter-spacing:3px}
  header p{margin:6px 0 0;font-size:13px;color:#9aa0a6}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:13px;margin:10px 0 6px;color:#cfcabb}
  input[type=text],input[type=date],textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#12141a;color:#e8e6df;font-family:inherit}
  textarea{min-height:60px;resize:vertical;line-height:1.5}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  button{cursor:pointer;border:none;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700}
  .gold{background:var(--gold);color:#15171c}.gold:hover{background:#dab863}
  .ghost{background:#2a2d34;color:#e8e6df}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .preview{text-align:center;background:#000;border:1px solid var(--line);border-radius:12px;padding:12px}
  canvas{max-width:100%;height:auto;border-radius:8px}
  .tag{display:inline-block;background:#2a2d34;color:var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
  a.back{color:var(--gold);font-size:14px;text-decoration:none}
  .row2{display:flex;gap:12px;flex-wrap:wrap}.row2>div{flex:1;min-width:130px}
  .row3{display:flex;gap:12px;flex-wrap:wrap}.row3>div{flex:1;min-width:100px}
</style>
</head>
<body>
<header>
  <h1>SPOTTED RYBNIK</h1>
  <p>Raport zasięgów reklamy · do wysłania klientowi · carbon + złoto</p>
</header>

<div class="wrap">
  <div style="margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap"><a class="back" href="spotted-rybnik.html">← Generator postów</a><a class="back" href="spotted-reklama-firm.html">🏢 Reklama dla firm</a><a class="back" href="spotted-cennik.html">💰 Cennik</a></div>

  <div class="card">
    <span class="tag">KLIENT</span>
    <label>Wybierz klienta (z biblioteki logotypów)</label>
    <select id="client"><option value="">— wpisz ręcznie / bez logo —</option></select>
    <div class="hint">Logo i daty pobiorą się automatycznie. Możesz je nadpisać poniżej.</div>
    <label>Nazwa firmy</label>
    <input type="text" id="firma" placeholder="np. M5 Transport">
    <div class="row2">
      <div><label>Okres — od</label><input type="date" id="od"></div>
      <div><label>Okres — do</label><input type="date" id="do"></div>
    </div>
  </div>

  <div class="card">
    <span class="tag">WYNIKI (wpisz ze statystyk FB / IG)</span>
    <div class="row3">
      <div><label>Zasięg (osób)</label><input type="text" id="zasieg" inputmode="numeric" placeholder="np. 8 400"></div>
      <div><label>Wyświetlenia</label><input type="text" id="wysw" inputmode="numeric" placeholder="np. 15 200"></div>
      <div><label>Reakcje</label><input type="text" id="reakcje" inputmode="numeric" placeholder="np. 320"></div>
    </div>
    <div class="row3">
      <div><label>Komentarze</label><input type="text" id="koment" inputmode="numeric" placeholder="np. 45"></div>
      <div><label>Udostępnienia</label><input type="text" id="udost" inputmode="numeric" placeholder="np. 12"></div>
      <div><label>Wejścia / kliknięcia</label><input type="text" id="wejscia" inputmode="numeric" placeholder="np. 210"></div>
    </div>
    <label>Wezwanie na dole (CTA)</label>
    <input type="text" id="cta" value="Przedłuż reklamę na kolejny miesiąc — napisz w wiadomości">
  </div>

  <div class="card">
    <span class="tag">WYGLĄD</span>
    <div class="row2">
      <div><label>Format</label><select id="fmt"><option value="45" selected>4:5 (post)</option><option value="11">1:1</option><option value="916">9:16 (relacja)</option></select></div>
    </div>
  </div>

  <div class="btns"><button class="gold" onclick="dl()">⬇️ Pobierz raport (PNG)</button><button class="ghost" onclick="draw()">🔄 Odśwież</button></div>
  <div class="hint" id="info"></div>
  <div id="exp"></div>

  <div class="card">
    <span class="tag">PODGLĄD</span>
    <div class="preview"><canvas id="cv" width="1080" height="1350"></canvas></div>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const SERIF="Georgia,'Times New Roman',serif";
let W=1080,H=1350;
const $=id=>document.getElementById(id);
const val=id=>(($(id)||{}).value||"").trim();
function fmt(){const v=$('fmt').value;if(v==="11")return[1080,1080];if(v==="916")return[1080,1920];return[1080,1350];}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function metal(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,"#fdfbf3");g.addColorStop(0.42,"#efe4c6");g.addColorStop(0.55,"#c8ad66");g.addColorStop(1,"#8a6c2e");return g;}
function goldGrad(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,"#f3e2b0");g.addColorStop(1,"#c49a4e");return g;}
function acc(a){return "rgba(226,192,110,"+a+")";}
function wrap(t,maxW,font){ctx.font=font;const words=(t||"").split(/\s+/);const L=[];let c="";for(const w of words){const t2=c?c+" "+w:w;if(ctx.measureText(t2).width<=maxW||!c)c=t2;else{L.push(c);c=w;}}if(c)L.push(c);return L;}
function fmtNum(s){const d=String(s).replace(/\s/g,"");if(/^\d+$/.test(d))return d.replace(/\B(?=(\d{3})+(?!\d))/g," ");return s;}

// ---- biblioteka logotypów (ta sama co w generatorze) ----
let LOGOS=[], CURIMG=null;
async function loadLogos(){
  try{LOGOS=JSON.parse(localStorage.getItem('spottedLogos')||'[]');}catch(e){LOGOS=[];}
  try{const r=await fetch('spotted-logos.json',{cache:'no-store'});if(r.ok){const def=await r.json();if(Array.isArray(def))def.forEach(l=>{if(l&&l.id&&l.data&&!LOGOS.some(x=>x.id===l.id))LOGOS.push(l);});}}catch(e){}
  const sel=$('client');
  LOGOS.forEach((l,i)=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name&&l.name.trim()?l.name:('Logo '+(i+1));sel.appendChild(o);});
  // prefill z ?c=
  const q=new URLSearchParams(location.search).get('c');
  if(q&&LOGOS.some(l=>l.id===q)){sel.value=q;pickClient();}
  else draw();
}
function pickClient(){
  const id=$('client').value;const l=LOGOS.find(x=>x.id===id);
  CURIMG=null;
  if(!l){draw();return;}
  if(l.name)$('firma').value=l.name;
  if(l.start)$('od').value=l.start;
  if(l.end)$('do').value=l.end;
  const im=new Image();im.onload=()=>{CURIMG=im;draw();};im.onerror=()=>{CURIMG=null;draw();};im.src=l.data;
}

function background(){
  ctx.fillStyle="#0a0a0c";ctx.fillRect(0,0,W,H);
  ctx.save();
  for(let i=-H;i<W;i+=7){ctx.strokeStyle="rgba(255,255,255,0.020)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
  for(let i=-H;i<W+H;i+=7){ctx.strokeStyle="rgba(0,0,0,0.30)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-H,H);ctx.stroke();}
  ctx.restore();
  const glow=(x,y,r,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,acc(a));g.addColorStop(1,acc(0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);};
  glow(W*0.9,H*0.06,W*0.55,0.26);glow(W*0.05,H*0.5,W*0.4,0.18);glow(W*0.5,H*0.98,W*0.5,0.12);
  ctx.strokeStyle=acc(0.55);ctx.lineWidth=2.5;rr(26,26,W-52,H-52,4);ctx.stroke();
  ctx.strokeStyle=acc(0.22);ctx.lineWidth=1;rr(38,38,W-76,H-76,3);ctx.stroke();
}
function medallion(cx,cy,r){
  ctx.save();
  const gd=ctx.createRadialGradient(cx,cy-r*0.3,r*0.2,cx,cy,r*1.15);gd.addColorStop(0,"rgba(20,20,22,0.9)");gd.addColorStop(1,"rgba(10,10,12,0.9)");
  ctx.fillStyle=gd;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.lineWidth=r*0.05;ctx.strokeStyle=metal(cy-r,cy+r);ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  ctx.lineWidth=r*0.02;ctx.strokeStyle=acc(0.6);ctx.beginPath();ctx.arc(cx,cy,r*0.86,0,7);ctx.stroke();
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=metal(cy-r*0.5,cy+r*0.5);
  ctx.font="bold "+(r*0.3)+"px "+SERIF;ctx.fillText("SPOTTED",cx,cy-r*0.16);ctx.fillText("RYBNIK",cx,cy+r*0.2);
  ctx.font="italic "+(r*0.13)+"px "+SERIF;ctx.fillStyle="#cbb06a";ctx.fillText("raport reklamy",cx,cy+r*0.55);
  ctx.restore();
}
function tileStat(x,y,w,h,num,label){
  ctx.save();
  ctx.fillStyle="rgba(15,16,20,0.7)";rr(x,y,w,h,16);ctx.fill();
  ctx.strokeStyle=acc(0.45);ctx.lineWidth=1.5;rr(x,y,w,h,16);ctx.stroke();
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  let nf=Math.min(74,h*0.5);ctx.font="bold "+nf+"px "+SERIF;
  while(ctx.measureText(num).width>w-40&&nf>30){nf-=2;ctx.font="bold "+nf+"px "+SERIF;}
  ctx.fillStyle=metal(y+h*0.18,y+h*0.62);ctx.fillText(num,x+w/2,y+h*0.55);
  ctx.fillStyle="#cbb06a";ctx.font="600 "+Math.round(h*0.16)+"px "+SERIF;
  ctx.fillText(label,x+w/2,y+h-18);
  ctx.restore();
}
function periodText(){
  const a=val('od'),b=val('do');const f=s=>{try{return new Date(s).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});}catch(e){return s;}};
  if(a&&b)return f(a)+" – "+f(b);if(b)return "do "+f(b);if(a)return "od "+f(a);return "";
}

function draw(){
  const d=fmt();W=d[0];H=d[1];cv.width=W;cv.height=H;
  background();
  const cx=W/2;
  const mr=Math.min(120,H*0.095);
  medallion(cx,120+mr*0.1,mr);
  let y=120+mr*1.2+34;
  // logo klienta
  if(CURIMG&&CURIMG.complete&&CURIMG.naturalWidth){
    const lh=118,lw=CURIMG.naturalWidth*(lh/CURIMG.naturalHeight);
    ctx.save();ctx.shadowColor="rgba(0,0,0,0.4)";ctx.shadowBlur=12;ctx.drawImage(CURIMG,cx-lw/2,y,Math.min(lw,W-160),lh);ctx.restore();
    y+=lh+22;
  }
  // nazwa firmy
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  const firma=val('firma');
  if(firma){let fs=52;ctx.font="bold "+fs+"px "+SERIF;while(ctx.measureText(firma).width>W-150&&fs>28){fs-=2;ctx.font="bold "+fs+"px "+SERIF;}ctx.fillStyle=metal(y-fs,y+8);ctx.fillText(firma,cx,y);y+=20;}
  // RAPORT REKLAMY
  y+=42;ctx.fillStyle=goldGrad(y-30,y+6);ctx.font="600 34px "+SERIF;try{ctx.letterSpacing="3px";}catch(e){}
  ctx.fillText("RAPORT REKLAMY",cx,y);try{ctx.letterSpacing="0px";}catch(e){}
  // okres
  const okr=periodText();if(okr){y+=40;ctx.fillStyle="#cbb06a";ctx.font="italic 27px "+SERIF;ctx.fillText(okr,cx,y);}
  y+=40;
  // kafelki statystyk
  const stats=[["Zasięg (osób)","zasieg"],["Wyświetlenia","wysw"],["Reakcje","reakcje"],["Komentarze","koment"],["Udostępnienia","udost"],["Wejścia / kliknięcia","wejscia"]]
    .map(([lab,id])=>({lab,v:val(id)})).filter(s=>s.v).map(s=>({lab:s.lab,v:fmtNum(s.v)}));
  const pad=60,gap=20,cols=2;const colW=(W-pad*2-gap)/cols;
  const rows=Math.ceil(stats.length/cols);
  const avail=H-y-150;
  const th=stats.length?Math.max(120,Math.min(168,(avail-(rows-1)*gap)/rows)):0;
  stats.forEach((s,i)=>{const tx=pad+(i%cols)*(colW+gap),ty=y+Math.floor(i/cols)*(th+gap);tileStat(tx,ty,colW,th,s.v,s.lab);});
  y=y+rows*(th+gap)+8;
  // CTA
  const cta=val('cta');
  if(cta){ctx.fillStyle=goldGrad(y,y+90);let cfs=30;let ln=wrap(cta,W-150,"600 italic "+cfs+"px "+SERIF);while((y+ln.length*cfs*1.25)>H-52&&cfs>20){cfs-=1;ln=wrap(cta,W-150,"600 italic "+cfs+"px "+SERIF);}ctx.font="600 italic "+cfs+"px "+SERIF;let ny=y+cfs;ln.forEach(l=>{ctx.fillText(l,cx,ny);ny+=cfs*1.25;});}
}

function dl(){
  draw();const info=$('info');
  cv.toBlob(b=>{
    if(b){const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;const nm=(val('firma')||'klient').replace(/[^a-z0-9]+/gi,'-').toLowerCase();a.download="raport-"+nm+"-spotted-rybnik.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
    const exp=$('exp');exp.innerHTML='<div class="hint" style="margin:8px 0">📱 Na telefonie: przytrzymaj obraz i wybierz „Zapisz".</div>';
    const im=new Image();im.src=cv.toDataURL('image/png');im.style.maxWidth="100%";im.style.borderRadius="8px";exp.appendChild(im);
    if(info){info.textContent="Pobrano raport ✓";setTimeout(()=>info.textContent="",2500);}
  },'image/png');
}
$('client').addEventListener('change',pickClient);
['firma','od','do','zasieg','wysw','reakcje','koment','udost','wejscia','cta'].forEach(id=>{const el=$(id);if(el)el.addEventListener('input',draw);});
$('fmt').addEventListener('change',draw);
loadLogos();
</script>
</body>
</html>
