<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>MapJob — łączenie…</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; padding: 40px; max-width: 480px; margin: 0 auto; }
      .ok { color: #065f46; background: #ecfdf5; padding: 12px; border-radius: 6px; }
      .err { color: #991b1b; background: #fee2e2; padding: 12px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Łączenie z MapJob</h1>
    <div id="status">Odbieram token…</div>
    <script type="module">
      (async () => {
        const hash = new URLSearchParams(window.location.hash.slice(1));
        const token = hash.get('token');
        const orgId = hash.get('org_id');
        const status = document.getElementById('status');

        if (!token || !orgId) {
          status.className = 'err';
          status.textContent = 'Brak tokenu w URL.';
          return;
        }

        const deviceId = (await chrome.storage.local.get('deviceId')).deviceId;
        const [, payloadB64] = token.split('.');
        const payload = JSON.parse(atob(payloadB64.replace(/-/g, '+').replace(/_/g, '/')));
        await chrome.storage.session.set({
          auth: {
            token,
            orgId,
            userId: payload.sub,
            deviceId,
            expiresAt: payload.exp * 1000,
          },
        });
        status.className = 'ok';
        status.textContent = 'Połączono. Możesz zamknąć tę kartę i wrócić do popupu rozszerzenia.';
        setTimeout(() => window.close(), 2500);
      })();
    </script>
  </body>
</html>
