<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapJob FB Poster</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #111;
        background: #fff;
      }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
      .status.ok { background: #ecfdf5; color: #065f46; }
      .status.warn { background: #fef3c7; color: #92400e; }
      .status.err { background: #fee2e2; color: #991b1b; }
      button {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        background: #fff;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; }
      .meta { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>MapJob FB Poster</h1>
    <div id="status" class="status warn">Sprawdzam status…</div>

    <button id="btn-login" class="primary" style="display:none">Zaloguj przez web app</button>
    <button id="btn-scrape" style="display:none">Importuj grupy z Facebooka</button>
    <div class="row" style="display:none" id="row-toggle">
      <button id="btn-pause">Pauza</button>
      <button id="btn-resume">Wznów</button>
    </div>
    <button id="btn-logout" style="display:none">Wyloguj</button>

    <div class="meta" id="meta"></div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
