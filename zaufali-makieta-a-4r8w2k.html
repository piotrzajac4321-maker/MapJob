<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapJob — Zaufali Nam (Wariant A)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080D18;
      color: #F0F4FF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 0 48px;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Dev label */
    .note {
      background: #1D6FF2;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-align: center;
      padding: 6px 12px;
      border-radius: 6px;
      margin: 0 16px 20px;
      text-transform: uppercase;
    }

    /* ── FAKE MAP ────────────────────────────────────────── */
    .map-section {
      position: relative;
      height: 220px;
      background: #0e1a2e;
      border-radius: 20px;
      margin: 0 16px;
      overflow: hidden;
    }

    /* Grid lines to mimic map tiles */
    .map-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Subtle road lines */
    .map-section::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(120deg, transparent 30%, rgba(255,255,255,.06) 30%, rgba(255,255,255,.06) 31%, transparent 31%),
        linear-gradient(60deg, transparent 45%, rgba(255,255,255,.05) 45%, rgba(255,255,255,.05) 46%, transparent 46%),
        linear-gradient(90deg, transparent 55%, rgba(255,255,255,.04) 55%, rgba(255,255,255,.04) 57%, transparent 57%);
    }

    /* Cluster pins */
    .cluster {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 0 0 3px rgba(29,111,242,.35), 0 4px 16px rgba(0,0,0,.5);
      z-index: 2;
    }
    .cluster-lg {
      width: 52px; height: 52px;
      background: #1D6FF2;
      font-size: 16px;
    }
    .cluster-md {
      width: 40px; height: 40px;
      background: #0fa0c8;
    }
    .cluster-sm {
      width: 32px; height: 32px;
      background: #00B8D9;
      font-size: 11px;
    }
    .c1 { top: 50px;  left: 60px; }
    .c2 { top: 30px;  right: 70px; }
    .c3 { top: 110px; right: 100px; }
    .c4 { top: 130px; left: 130px; }

    /* Pulse ring on largest cluster */
    .c1::before {
      content: '';
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(29,111,242,.4);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(.7); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .map-btn {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.18);
      color: #F0F4FF;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      letter-spacing: .02em;
    }

    /* ── ZAUFALI NAM SECTION ─────────────────────────────── */
    .trusted-section {
      padding: 32px 16px 24px;
    }

    .section-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section-eyebrow span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      color: #00B8D9;
      text-transform: uppercase;
    }
    .eyebrow-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(0,184,217,.4), transparent);
    }

    .section-headline {
      font-size: 22px;
      font-weight: 800;
      color: #F0F4FF;
      line-height: 1.25;
      margin-bottom: 6px;
      letter-spacing: -.02em;
    }
    .section-headline em {
      font-style: normal;
      color: #1D6FF2;
    }

    .section-subtext {
      font-size: 13px;
      color: #8A94A8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* ── TICKER / MARQUEE ───────────────────────────────── */
    .ticker-wrapper {
      position: relative;
      overflow: hidden;
      /* Fade edges */
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    }

    .ticker-track {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: ticker-scroll 28s linear infinite;
    }
    .ticker-track:hover {
      animation-play-state: paused;
    }

    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .logo-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 14px rgba(0,0,0,.2);
      padding: 10px 18px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-card svg {
      display: block;
      height: 28px;
      width: auto;
    }

    .ticker-more {
      text-align: right;
      margin-top: 12px;
      font-size: 12px;
      color: #8A94A8;
      letter-spacing: .02em;
    }
    .ticker-more a {
      color: #1D6FF2;
      text-decoration: none;
      font-weight: 600;
    }

    /* ── BOTTOM BADGE ───────────────────────────────────── */
    .trust-badge {
      margin: 0 16px;
      padding: 14px 18px;
      background: rgba(29,111,242,.08);
      border: 1px solid rgba(29,111,242,.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .trust-badge-icon {
      width: 36px;
      height: 36px;
      background: rgba(29,111,242,.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .trust-badge-icon svg {
      width: 18px;
      height: 18px;
    }
    .trust-badge-text {
      font-size: 12px;
      color: #8A94A8;
      line-height: 1.5;
    }
    .trust-badge-text strong {
      display: block;
      color: #F0F4FF;
      font-size: 13px;
      margin-bottom: 1px;
    }
  </style>
</head>
