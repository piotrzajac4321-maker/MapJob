<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MJ Stats">
<link rel="manifest" href="/stats-widget.webmanifest">
<title>Statystyki — MapJob</title>
<style>
:root{--bg:#080D18;--surf:#131C2D;--surf2:#1A2438;--border:rgba(255,255,255,.10);--text:#F0F4FF;--text2:#94A3B8;--text3:#5A6678;--blue:#60A5FA;--purple:#A78BFA;--green:#22C55E;--gold:#F59E0B;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:env(safe-area-inset-top,14px) 14px env(safe-area-inset-bottom,14px);max-width:680px;margin:0 auto;min-height:100dvh}
h1{font-size:18px;font-weight:900;margin-bottom:2px}
.sub{font-size:11px;color:var(--text3);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10px;color:var(--text3);font-weight:700}
.kpi .v{font-size:24px;font-weight:900;margin-top:3px}
.kpi-online{cursor:pointer;border-color:rgba(34,197,94,.25);transition:border-color .15s,background .15s}
.kpi-online:hover,.kpi-online:active{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.06)}
.kpi-online .hint{font-size:10px;color:var(--text3);margin-top:4px}
.sec-h{font-size:13px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.sec-h .cnt{font-size:11px;color:var(--text3);font-weight:600}
.row{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
.row .rk{font-size:12px;font-weight:800;color:var(--text3);min-width:24px;text-align:right;padding-top:1px}
.row .mid{flex:1;min-width:0}
.row .t{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.row .m{font-size:11px;color:var(--text3);margin-top:2px;overflow-wrap:anywhere}
.row .s{font-size:11px;color:var(--blue);margin-top:3px;font-weight:700}
.row .s b{color:var(--purple)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:900;padding:5px 10px;border-radius:8px;flex-shrink:0;background:var(--surf);border:1px solid var(--border);color:var(--blue)}
.more{width:100%;padding:11px;margin:2px 0 16px;border-radius:10px;background:var(--surf);border:1px solid var(--border);color:var(--text2);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.btn{padding:10px 14px;border-radius:10px;background:var(--surf);border:1px solid var(--border);color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.btnp{background:linear-gradient(135deg,#2563EB,#1D6FF2);border:none;color:#fff}
.fi{width:100%;padding:11px 12px;border-radius:10px;background:var(--surf2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:14px;margin-bottom:8px;outline:none}
.fi:focus{border-color:rgba(96,165,250,.5)}
.muted{color:var(--text3);font-size:12px;line-height:1.6}
.center{text-align:center;padding:40px 16px}
.empty{text-align:center;padding:16px;color:var(--text3);font-size:13px}
.loader{text-align:center;padding:18px;color:var(--text3);font-size:13px}
.err{color:#F87171;font-size:12px;margin-top:6px;min-height:16px}
.summary{background:linear-gradient(135deg,rgba(96,165,250,.08),rgba(96,165,250,.02));border:1px solid rgba(96,165,250,.2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.7;color:var(--text2)}
.pinrow{font-size:30px;letter-spacing:8px;text-align:center}
/* PIN screen */
#pin-screen{padding-top:60px}
/* modal aktywni użytkownicy */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal-sheet{background:var(--surf);border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px);max-height:80dvh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-title{font-size:15px;font-weight:900}
.modal-close{background:var(--surf2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer}
.usr-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surf2);border:1px solid rgba(34,197,94,.2);border-radius:10px;margin-bottom:6px}
.usr-dot{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 6px #22C55E;flex-shrink:0;margin-top:4px}
.usr-name{font-size:13px;font-weight:800}
.usr-meta{font-size:11px;color:var(--text3);margin-top:2px;overflow-wrap:anywhere}
/* loading bar */
#ld{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:slide 1.2s ease-in-out infinite;display:none;z-index:300}
#ld.on{display:block}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
</style>
</head>
<body>

<div id="ld"></div>

<div id="app"><div class="loader">Ładowanie…</div></div>

<!-- Modal aktywni użytkownicy -->
<div id="online-modal" style="display:none" class="modal-bg" onclick="if(event.target===this)closeOnlineModal()">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <div class="modal-title">🟢 Aktywni teraz</div>
      <button class="modal-close" onclick="closeOnlineModal()">✕ Zamknij</button>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:12px">Sesje aktywne w ciągu ostatnich 2 minut</div>
    <div id="online-modal-body"><div class="loader">Ładowanie…</div></div>
  </div>
</div>

<script>
var API = 'https://ahgzjneegvptudphibdm.supabase.co/functions/v1/quick-stats'
var TOKEN_KEY = 'mj_qs_tok_v2'
var _data = null
var _expanded = false
var _token = null

function $$(id){ return document.getElementById(id) }
function ld(on){ $$('ld').classList.toggle('on', on) }
function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML }

async function api(body){
  var r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
  return r.json()
}

/* ══ INIT ══ */
window.addEventListener('load', function(){
  _token = localStorage.getItem(TOKEN_KEY)
  if (!_token) { showPin(); return }
  ld(true)
  api({action:'get_stats', token:_token}).then(function(d){
    ld(false)
    if (d.ok && d.stats) { _data=d.stats; renderDashboard() }
    else { localStorage.removeItem(TOKEN_KEY); _token=null; showPin() }
  }).catch(function(){ ld(false); showPin() })
})

/* ══ PIN SCREEN ══ */
function showPin(){
  $$('app').innerHTML =
    '<div id="pin-screen">'
    + '<div class="center"><h1>📊 MapJob Stats</h1><div class="sub">Wpisz PIN, aby zobaczyć statystyki</div></div>'
    + '<div style="max-width:280px;margin:0 auto">'
    + '<input class="fi pinrow" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" placeholder="••••">'
    + '<button class="btn btnp" style="width:100%;margin-top:4px" id="pin-btn">Odblokuj</button>'
    + '<div class="err" id="pin-err"></div>'
    + '</div>'
    + '</div>'
  var inp = $$('pin')
  function submit(){
    var pin = (inp.value||'').trim()
    if (!pin) return
    var btn = $$('pin-btn')
    btn.disabled=true; btn.textContent='Sprawdzam…'; $$('pin-err').textContent=''
    ld(true)
    api({action:'verify_pin', pin:pin}).then(function(d){
      ld(false); btn.disabled=false; btn.textContent='Odblokuj'
      if (d.error){ $$('pin-err').textContent=d.error; inp.value=''; inp.focus() }
      else { _token=d.token; localStorage.setItem(TOKEN_KEY,_token); _data=d.stats; renderDashboard() }
    }).catch(function(){ ld(false); btn.disabled=false; btn.textContent='Odblokuj'; $$('pin-err').textContent='Błąd połączenia. Sprawdź internet.' })
  }
  $$('pin-btn').onclick = submit
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit() })
  setTimeout(function(){ inp.focus() }, 120)
}

/* ══ DASHBOARD ══ */
function kpiCard(label, val, color){
  return '<div class="kpi"><div class="l">'+label+'</div><div class="v"'+(color?' style="color:'+color+'"':'')+'>'+(val==null?'—':val)+'</div></div>'
}
function kpiOnlineCard(val){
  return '<div class="kpi kpi-online" onclick="showOnlineUsers()">'
    +'<div class="l">🟢 Online (2 min)</div>'
    +'<div class="v" style="color:var(--green)">'+(val==null?'—':val)+'</div>'
    +'<div class="hint">Kliknij, aby zobaczyć ▾</div>'
    +'</div>'
}

var COUNTRY_NAMES={PL:'Polska',DE:'Niemcy',NL:'Holandia',BE:'Belgia',GB:'Wielka Brytania',IE:'Irlandia',FR:'Francja',CZ:'Czechy',SK:'Słowacja',NO:'Norwegia',SE:'Szwecja',DK:'Dania',AT:'Austria',CH:'Szwajcaria',IT:'Włochy',ES:'Hiszpania',UA:'Ukraina',US:'USA'}
function flagEmoji(cc){ if(!cc||cc.length!==2) return '🌐'; return String.fromCodePoint.apply(null, cc.toUpperCase().split('').map(function(c){return 127397+c.charCodeAt(0)})) }

function genSumHtml(k){
  function T(x){ return x!=null?x:'—' }
  return '🧑 Unikalni (30 dni): <b style="color:var(--blue)">'+T(k.visitors_real_30d)+'</b> · łącznie od początku: <b>'+T(k.visitors_total)+'</b><br>'
    +'📊 Sesje (30 dni): <b style="color:var(--purple)">'+T(k.visits_real_30d)+'</b><br>'
    +'🤖 Wszystkie wejścia (z botami i adminem): 24h <b>'+T(k.visits_24h)+'</b> · 7 dni <b>'+T(k.visits_7d)+'</b> · 30 dni <b>'+T(k.visits_30d)+'</b><br>'
    +'👁 Wyświetlenia ogłoszeń (30 dni): <b style="color:var(--blue)">'+T(k.views_30d)+'</b> · łącznie: <b>'+T(k.views_total)+'</b>'
}

function countriesHtml(rows){
  if (!rows||!rows.length) return '🌍 <b>Skąd są odwiedzający</b><br><span style="color:var(--text3)">Brak danych.</span>'
  var total = rows.reduce(function(s,x){return s+(x.sessions||0)},0)
  var html = rows.slice(0,8).map(function(x){
    var cc=(x.country||'').toUpperCase()
    var pct = total?Math.round((x.sessions||0)*100/total):0
    return flagEmoji(cc)+' '+(COUNTRY_NAMES[cc]||cc)+': <b style="color:var(--blue)">'+(x.sessions||0)+'</b> <span style="color:var(--text3)">('+pct+'%)</span>'
  }).join(' · ')
  return '🌍 <b>Skąd są odwiedzający</b> <span style="color:var(--text3)">(wg sesji, bez adminów)</span><br>'+html
}

function funnelHtml(rows){
  var prompts=0, reveals=0
  ;(rows||[]).forEach(function(x){ prompts+=(x.prompts||0); reveals+=(x.reveals||0) })
  if (!prompts&&!reveals) return '📞 <b>Lejek kontaktu</b><br><span style="color:var(--text3)">Brak danych.</span>'
  var left=Math.max(0,prompts-reveals)
  var pR=prompts?Math.round(reveals*100/prompts):0
  var pL=prompts?Math.round(left*100/prompts):0
  return '📞 <b>Lejek kontaktu</b> <span style="color:var(--text3)">(prośba „wspomń o MapJob")</span><br>'
    +'👀 Zobaczyło notatkę: <b>'+prompts+'</b><br>'
    +'✅ Odsłoniło numer: <b style="color:var(--green)">'+reveals+'</b> ('+pR+'%)<br>'
    +'🚪 Odeszło na notatce: <b style="color:#F87171">'+left+'</b> ('+pL+'%)'
}

function rowHtml(rank, r){
  var meta = r.meta
  if (r.kind==='job') meta += ' · 📞 '+r.clicks_phone+' · ⚡ '+r.clicks_apply+'→📨 '+r.applications
  else meta += ' · 📞 '+r.clicks_phone
  return '<div class="row" data-s="'+esc((r.title+' '+r.meta).toLowerCase())+'">'
    +'<div class="rk">'+rank+'.</div>'
    +'<div class="mid">'
    +'<div class="t">'+esc(r.title)+'</div>'
    +(meta?'<div class="m">'+esc(meta)+'</div>':'')
    +'<div class="s">24h: '+r.v24h+' · 7d: '+r.v7d+' · <b>👤 '+r.uniq+'</b></div>'
    +'</div>'
    +'<span class="chip">👁 '+r.views+'</span>'
    +'</div>'
}

var TOP = 10

function renderDashboard(){
  var s = _data
  var k = s.kpi || {}
  _expanded = false

  $$('app').innerHTML =
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px">'
    +  '<div><h1>🏁 Statystyki</h1><div class="sub">Wejścia na stronę i ruch · tylko dla Ciebie</div></div>'
    +  '<button class="btn" id="btn-refresh" style="flex-shrink:0">🔄</button>'
    +'</div>'
    +'<div class="kpis">'
    +  kpiOnlineCard(k.online)
    +  kpiCard('🧑 Unikalni (24h)',  k.visitors_real_24h, 'var(--blue)')
    +  kpiCard('🧑 Unikalni (7 dni)',k.visitors_real_7d,  'var(--blue)')
    +  kpiCard('🏁 Sesje (24h)',     k.visits_real_24h,   'var(--purple)')
    +'</div>'
    +'<div class="kpis" style="grid-template-columns:1fr;margin-top:-8px">'
    +  kpiCard('🏁 Sesje (7 dni)',   k.visits_real_7d,    'var(--purple)')
    +'</div>'
    +'<div class="summary" id="gen-sum">'+genSumHtml(k)+'</div>'
    +'<div class="summary" id="countries">'+countriesHtml(s.countries)+'</div>'
    +'<div class="summary" id="funnel">'+funnelHtml(s.funnel)+'</div>'
    +'<button class="more" id="ogl-toggle">📢 Zobacz statystyki ogłoszeń ▾</button>'
    +'<div id="ogl-wrap" style="display:none">'
    +  '<input class="fi" id="q" placeholder="🔎 filtruj po nazwie / tytule / mieście">'
    +  '<div class="sec-h">📢 Ogłoszenia <span class="cnt" id="cnt-ogl"></span></div>'
    +  '<div id="list-ogl"></div>'
    +  '<button class="more" id="more-btn" style="display:none">Pokaż więcej statystyk ▾</button>'
    +  '<div id="extra" style="display:none">'
    +    '<div class="sec-h" style="margin-top:8px">📍 Profile fachowców <span class="cnt" id="cnt-pins"></span></div>'
    +    '<div id="list-pins"></div>'
    +  '</div>'
    +'</div>'
    +'<div style="text-align:center;margin:10px 0 30px">'
    +  '<button class="btn" id="btn-logout">Wyloguj</button>'
    +'</div>'

  $$('btn-refresh').onclick = doRefresh
  $$('btn-logout').onclick  = logout
  $$('ogl-toggle').onclick  = toggleOgl
  $$('more-btn').onclick    = toggleMore
  $$('q').addEventListener('input', applyFilter)

  renderLists()

  if (!window._statTimer) {
    window._statTimer = setInterval(doRefreshSilent, 30000)
  }
}

function renderLists(){
  var s = _data
  var ogl  = s.ogl  || []
  var pins = s.pins || []

  $$('cnt-ogl').textContent  = ogl.length  ? '· '+ogl.length+' poz.'  : ''
  $$('cnt-pins').textContent = pins.length ? '· '+pins.length+' poz.' : ''

  $$('list-ogl').innerHTML  = ogl.length  ? ogl.map(function(r,i){ return rowHtml(i+1,r) }).join('') : '<div class="empty">📭 Brak danych</div>'
  $$('list-pins').innerHTML = pins.length ? pins.map(function(r,i){ return rowHtml(i+1,r) }).join('') : '<div class="empty">📭 Brak danych</div>'

  var morBtn = $$('more-btn')
  if (morBtn) morBtn.style.display = ogl.length > TOP ? '' : 'none'

  applyFilter()
}

function toggleOgl(){
  var w = $$('ogl-wrap')
  var open = w.style.display==='none'
  w.style.display = open ? '' : 'none'
  $$('ogl-toggle').textContent = open ? '📢 Ukryj statystyki ogłoszeń ▴' : '📢 Zobacz statystyki ogłoszeń ▾'
}

function toggleMore(){
  _expanded = !_expanded
  $$('extra').style.display = _expanded ? '' : 'none'
  $$('more-btn').textContent = _expanded ? 'Pokaż mniej ▴' : 'Pokaż więcej statystyk ▾'
  applyFilter()
}

function applyFilter(){
  var qv = ($$('q')&&$$('q').value||'').trim().toLowerCase()
  var rows = [].slice.call($$('list-ogl').querySelectorAll('.row'))
  var shown = 0
  rows.forEach(function(row){
    var ok = !qv || (row.getAttribute('data-s')||'').indexOf(qv)>=0
    if (!ok){ row.style.display='none'; return }
    var within = qv ? true : (_expanded || shown < TOP)
    row.style.display = within ? '' : 'none'
    if (within) shown++
  })
  var mb = $$('more-btn')
  if (mb && (_data.ogl||[]).length > TOP){
    mb.style.display = qv ? 'none' : ''
    if (!qv) mb.textContent = _expanded ? 'Pokaż mniej ▴' : 'Pokaż więcej statystyk ▾'
  }
  if (qv) { var ex=$$('extra'); if(ex) ex.style.display='' }
  else if (!_expanded){ var ex=$$('extra'); if(ex) ex.style.display='none' }
  ;[].slice.call($$('list-pins').querySelectorAll('.row')).forEach(function(row){
    var ok = !qv || (row.getAttribute('data-s')||'').indexOf(qv)>=0
    row.style.display = ok ? '' : 'none'
  })
}

/* ══ REFRESH ══ */
async function doRefresh(){
  var btn = $$('btn-refresh')
  if (btn) { btn.disabled=true; btn.textContent='⏳' }
  ld(true)
  try {
    var d = await api({action:'get_stats', token:_token})
    if (d.ok && d.stats){ _data=d.stats; renderDashboard() }
    else if (d.error && /sesja|wygasła/i.test(d.error)){ localStorage.removeItem(TOKEN_KEY); _token=null; showPin() }
  } catch(e){}
  ld(false)
}

async function doRefreshSilent(){
  try {
    var d = await api({action:'get_stats', token:_token})
    if (d.ok && d.stats){
      var k=d.stats.kpi||{}
      var vs=document.querySelectorAll('.kpi .v')
      if (vs.length>=4){ vs[0].textContent=k.online; vs[1].textContent=k.visitors_real_24h; vs[2].textContent=k.visitors_real_7d; vs[3].textContent=k.visits_real_24h }
      var gs=$$('gen-sum'); if(gs) gs.innerHTML=genSumHtml(k)
    }
  } catch(e){}
}

/* ══ LOGOUT ══ */
function logout(){
  clearInterval(window._statTimer); window._statTimer=null
  localStorage.removeItem(TOKEN_KEY); _token=null; _data=null
  showPin()
}

/* ══ ONLINE MODAL ══ */
function closeOnlineModal(){
  var m = $$('online-modal'); if(m) m.style.display='none'
}
function _fmtDur(sec){
  if (sec==null||sec<0) return '—'
  if (sec<60) return sec+'s'
  var m=Math.floor(sec/60)
  return m<60 ? m+'m '+(sec%60)+'s' : Math.floor(m/60)+'h '+(m%60)+'m'
}
async function showOnlineUsers(){
  var m=$$('online-modal'), body=$$('online-modal-body')
  if (!m||!body) return
  m.style.display='flex'; body.innerHTML='<div class="loader">Ładowanie…</div>'
  try {
    var d = await api({action:'get_online', token:_token})
    if (!d.ok || d.error){ body.innerHTML='<div class="empty" style="color:#F87171">'+esc(d.error||'Błąd')+'</div>'; return }
    var rows = d.users||[]
    var now = Date.now()
    if (!rows.length){ body.innerHTML='<div class="empty">👤 Brak aktywnych użytkowników w tej chwili.</div>'; return }
    body.innerHTML = rows.map(function(s){
      var dur = Math.round((now-new Date(s.started_at).getTime())/1000)
      var age = Math.round((now-new Date(s.last_seen_at).getTime())/1000)
      var name = s.user_email ? (s.display_name||s.user_email) : 'Gość'
      var sub  = (s.user_email&&s.display_name) ? s.user_email : ''
      var flag = s.country ? flagEmoji(s.country)+' ' : ''
      var anon = !s.user_email ? ' <span style="color:var(--text3);font-size:10px;font-weight:600">(anonimowy)</span>' : ''
      return '<div class="usr-row">'
        +'<div class="usr-dot"></div>'
        +'<div style="flex:1;min-width:0">'
          +'<div class="usr-name">'+esc(name)+anon+'</div>'
          +(sub?'<div style="font-size:10px;color:var(--text3)">'+esc(sub)+'</div>':'')
          +'<div class="usr-meta">'+flag+esc(s.last_path||'—')+' · sesja '+_fmtDur(dur)+' · '+age+'s temu · '+(s.events_count||0)+' zd.</div>'
        +'</div>'
        +'</div>'
    }).join('')
  } catch(e){
    body.innerHTML='<div class="empty" style="color:#F87171">Błąd: '+esc(String(e))+'</div>'
  }
}
</script>
</body>
</html>
